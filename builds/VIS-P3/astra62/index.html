<style>

<body><svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
<title id="title">Straight Line Inversor</title>
<desc id="description">A bench-mounted precision instrument with a cream dial, blued steel arms and nickel links transforms the swing of a bronze crank into a vertical stroke. A vermilion index drives a pierced sliding crosshead on polished guide rails.</desc>
<defs><mask id="piercings" maskUnits="userSpaceOnUse" x="580" y="-25" width="600" height="50"><rect x="580" y="-25" width="600" height="50" fill="white"/><g id="cuts"/></mask>
<radialGradient id="desk" cx=".45" cy=".36" r=".76"><stop stop-color="#5c5c50"/><stop offset=".82" stop-color="#30332e"/><stop offset="1" stop-color="#262824"/></radialGradient>
<linearGradient id="rim" x2=".3" y2="1"><stop stop-color="#e2d6ae"/><stop offset=".035" stop-color="#8c8973"/><stop offset=".12" stop-color="#51564c"/><stop offset=".56" stop-color="#777b69"/><stop offset=".85" stop-color="#303730"/><stop offset="1" stop-color="#171d19"/></linearGradient>
<linearGradient id="enamel" x2=".6" y2="1"><stop stop-color="#435654"/><stop offset=".35" stop-color="#2f403e"/><stop offset="1" stop-color="#1b2b29"/></linearGradient>

<linearGradient id="bay" x2="0" y2="1"><stop stop-color="#121c1b"/><stop offset=".1" stop-color="#243331"/><stop offset=".9" stop-color="#23302d"/><stop offset="1" stop-color="#48544b"/></linearGradient>
<linearGradient id="steel" x2="0" y2="1"><stop stop-color="#f8f4dc"/><stop offset=".1" stop-color="#c7c8b5"/><stop offset=".37" stop-color="#a7ada1"/><stop offset=".8" stop-color="#7a837b"/><stop offset=".94" stop-color="#56615b"/><stop offset="1" stop-color="#ccd0be"/></linearGradient>
<linearGradient id="blue" x2="0" y2="1"><stop stop-color="#899895"/><stop offset=".12" stop-color="#536564"/><stop offset=".47" stop-color="#384b4c"/><stop offset=".88" stop-color="#233536"/><stop offset="1" stop-color="#778682"/></linearGradient>
<linearGradient id="bronze" x2="0" y2="1"><stop stop-color="#f6dea1"/><stop offset=".13" stop-color="#d5b577"/><stop offset=".58" stop-color="#ad8c52"/><stop offset=".88" stop-color="#846a42"/><stop offset="1" stop-color="#deca93"/></linearGradient>
<linearGradient id="rail"><stop stop-color="#343d39"/><stop offset=".13" stop-color="#7d877e"/><stop offset=".33" stop-color="#e6e5ce"/><stop offset=".46" stop-color="#ffffeb"/><stop offset=".58" stop-color="#a8afa2"/><stop offset=".84" stop-color="#5b665e"/><stop offset="1" stop-color="#8b9384"/></linearGradient>
<radialGradient id="head" cx=".3" cy=".15" r=".93"><stop stop-color="#f4efd9"/><stop offset=".51" stop-color="#b5b8a7"/><stop offset=".86" stop-color="#889285"/><stop offset=".94" stop-color="#c8cbb6"/><stop offset="1" stop-color="#5d685d"/></radialGradient>
<filter id="lift" x="-.15" y="-.22" width="1.3" height="1.6"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-.15" y="-.2" width="1.3" height="1.5"><feGaussianBlur stdDeviation="2.6"/></filter>
<path id="bodyshape" d="M176 151H641Q663 151 677 165L718 204Q728 213 744 213H1267Q1282 213 1294 224L1393 315Q1408 330 1408 351V550Q1408 570 1394 584L1294 676Q1282 687 1266 687H744Q729 687 718 697L677 736Q662 750 642 750H177Q144 750 144 718V184Q144 151 176 151Z"/>
<path id="face" d="M208 188H624Q637 188 646 197L685 235V666L646 704Q637 713 624 713H208Q182 713 182 686V215Q182 188 208 188Z"/>
<path id="well" d="M741 259H1242Q1254 259 1263 268L1352 349Q1362 358 1362 372V527Q1362 541 1352 551L1263 633Q1254 642 1241 642H741Q723 642 723 623V277Q723 259 741 259Z"/>
<g id="screw"><circle r="8" fill="#15201d"/><circle cy="-1" r="6.6" fill="url(#head)"/><path d="M-4 2.2L4 -3" stroke="#465048" stroke-width="2"/><path d="M-4 3.3L4 -1.9" stroke="#d5d8be" stroke-width=".8"/></g>
<g id="pin"><circle r="13.5" fill="#26312f" stroke="#151e1d"/><circle cy="-1" r="11.6" fill="url(#rail)" stroke="#dedcc3" stroke-width=".8"/><circle cy="-1" r="8.8" fill="url(#head)" stroke="#737d72"/><path d="M-5 2L5 -4" stroke="#414b45" stroke-width="2.6"/><path d="M-5 3.1L5 -2.9" stroke="#d6dac5" stroke-width="1"/></g>
<clipPath id="faceclip"><use href="#face"/></clipPath><clipPath id="caseclip"><use href="#bodyshape"/></clipPath>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M0 6L6 0" stroke="#939b88" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="#262824"/><rect x="10" y="10" width="1580" height="880" rx="12" fill="url(#desk)"/>
<g style="will-change:transform"><use href="#bodyshape" transform="translate(5 24)" fill="#080e0d" opacity=".75" filter="url(#lift)"/>
<use href="#bodyshape" transform="translate(0 10)" fill="#151b18" stroke="#101410" stroke-width="5"/>
<use href="#bodyshape" fill="url(#rim)" stroke="#abae94" stroke-width="2.5"/>
<use href="#bodyshape" transform="translate(13.5 7.1) scale(.982 .984)" fill="url(#enamel)" stroke="#172523" stroke-width="2"/>
<g id="patina" clip-path="url(#caseclip)"></g>
<use href="#well" fill="url(#bay)" stroke="#657166" stroke-width="4"/><use href="#well" fill="none" stroke="#0c1716" stroke-width="2" transform="translate(0 -2)"/>
<g id="ribs" stroke-linecap="round"></g>
<use href="#face" fill="url(#paper)" stroke="#121f1e" stroke-width="8"/><use href="#face" fill="none" stroke="#979e8e" stroke-width="2.5"/>
<g id="brushing" clip-path="url(#faceclip)"></g>
<g id="fasteners"></g>
<!-- A recessed twin-column guide and its bearing blocks. -->
<g id="columns"></g>
<g fill="none" stroke="#616a5e">
<path d="M588 210V690" stroke-width="1.5"/><g id="ticks"></g>
<path d="M475 320.096 A150 150 0 0 1 475 579.904" stroke-width="1.8"/>
<path d="M472 325.292 A144 144 0 0 1 472 574.708" opacity=".45"/>
<g id="angles"></g></g>
<g class="dial" text-anchor="middle"><text x="466" y="308">+60</text><text x="565" y="457">0</text><text x="466" y="605">−60</text></g>
<!-- Combined pedestal, engraved datum lines and fixed pivot sockets. -->
<path d="M260 423Q260 411 274 411H411Q433 411 433 435V474Q433 491 416 491H276Q260 491 260 475Z" transform="translate(1 4)" fill="#73776a"/>
<path d="M260 422Q260 410 274 410H411Q433 410 433 434V474Q433 488 416 488H276Q260 488 260 474Z" fill="url(#blue)" stroke="#34403c" stroke-width="2"/>
<path d="M272 479H419V483H272Z" fill="url(#hatch)"/>
<g id="pedestal"></g>
</g><g id="trail" stroke="#d14321" stroke-width="4.5" stroke-linecap="round"></g>
<g id="mechanics">
<g id="slide">
<rect x="1082" y="-28" width="128" height="56" rx="9" fill="url(#blue)" stroke="#182522" stroke-width="2"/>
<g fill="url(#rail)" stroke="#465249"><rect x="1075" y="-30" width="33" height="60" rx="5"/><rect x="1184" y="-30" width="33" height="60" rx="5"/></g>
<g fill="none" stroke="#47544b" stroke-width="2"><path d="M1078 -24h27m-27 48h27m83 -48h26m-26 48h26"/></g>
<path mask="url(#piercings)" d="M588 -7L1004 -13Q1043 -14 1072 -19L1151 -20Q1166 -20 1166 -6V6Q1166 20 1151 20L1072 19Q1043 14 1004 13L588 7Z" fill="url(#steel)" stroke="#414d46" stroke-width="2"/>
<g id="slots"></g><use href="#pin" x="1145"/>
</g>
<g id="bars"></g><g id="pointer"><path d="M97 -2L135 -2L136 -4L150 0L136 4L135 2L97 2Z" fill="#6d593a" stroke="#544b3d"/></g>
<g id="joints"></g>
<g id="output"><circle r="16.3" fill="#303c36" stroke="#e2debf" stroke-width="1.4"/><circle r="12" fill="#302e28" stroke="#ed5a30" stroke-width="4.8"/><circle r="5.1" fill="#ff7243"/></g>
</g>
<g font-size="19" font-style="italic" font-weight="bold"><text x="270" y="471" fill="#f0ebd5">O</text><text x="379" y="477" fill="#f0ebd5">Q</text><text id="pLabel" fill="#303c35" stroke="#dad5bd" stroke-width="3" paint-order="stroke">P</text></g>
</svg>
<script>
'use strict';
const ns='http://www.w3.org/2000/svg', get=id=>document.getElementById(id);
function el(parent,tag,attrs){const node=document.createElementNS(ns,tag);for(const k in attrs)node.setAttribute(k,attrs[k]);parent.append(node);return node}
const move=(node,x,y)=>node.setAttribute('transform','translate('+x+' '+y+')');
const use=(host,id,x,y)=>el(host,'use',{href:'#'+id,x,y});
let seed=34919;
function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function texture(id,n,x,y,w,h,ink,alpha,length){let d='';for(let i=0;i<n;i++)d+='M'+(x+w*rand()).toFixed(1)+' '+(y+h*rand()).toFixed(1)+'h'+(1+rand()*length).toFixed(1);el(get(id),'path',{d,stroke:ink,opacity:alpha,'stroke-width':.65})}
texture('patina',2900,145,152,1260,600,'#f1ebc7',.09,1.8);
texture('brushing',1100,182,188,504,525,'#807e6b',.16,12);
for(let i=0;i<5;i++){let x=765+i*54;el(get('ribs'),'path',{d:'M'+x+' 272v356',stroke:'#3d4a42','stroke-width':3});el(get('ribs'),'path',{d:'M'+(x+3)+' 272v356',stroke:'#182521','stroke-width':4})}
for(const [x,y] of [[171,179],[650,179],[171,722],[650,722],[205,211],[659,246],[205,690],[659,656],[746,237],[746,665],[1262,238],[1262,663],[1382,369],[1382,530]])use(get('fasteners'),'screw',x,y);
for(const x of [1092,1200]){const g=get('columns');el(g,'rect',{x:x-9,y:228,width:18,height:443,rx:6,fill:'url(#rail)',stroke:'#303d36'});for(const y of [229,650]){el(g,'rect',{x:x-28,y,width:56,height:22,rx:4,fill:'url(#steel)',stroke:'#1e2924'});use(g,'screw',x-18,y+11);use(g,'screw',x+18,y+11)}}
for(let y=210;y<=690;y+=40)el(get('ticks'),'path',{d:'M582 '+y+'h21'});
const rad=Math.PI/180;
for(let a=-60;a<=60;a+=15){const c=Math.cos(a*rad),s=-Math.sin(a*rad),r=a%30===0?160:156;el(get('angles'),'line',{x1:400+150*c,y1:450+150*s,x2:400+r*c,y2:450+r*s,'stroke-width':a%30===0?2:1.3})}
for(const x of [300,400]){el(get('pedestal'),'circle',{cx:x,cy:450,r:25,fill:'url(#rail)',stroke:'#172422','stroke-width':2});el(get('pedestal'),'circle',{cx:x,cy:450,r:20,fill:'url(#blue)',stroke:'#bec3ad'})}
for(const [x,y] of [[273,423],[420,423]])use(get('pedestal'),'screw',x,y);
for(const [x,w,h] of [[747,56,6],[820,68,7],[906,79,8],[1004,68,10],[1086,36,13]]){const slot={x,y:-h/2,width:w,height:h,rx:h/2};el(get('cuts'),'rect',{...slot,fill:'black'});el(get('slots'),'rect',{...slot,fill:'none',stroke:'#a9af9f','stroke-width':1})}
function bar(len,width,mat,groove){const g=el(get('bars'),'g',{}),r=width/2;
el(g,'rect',{x:-r,y:-r,width:len+width,height:width,rx:r,fill:'url(#'+mat+')',stroke:'#313b34','stroke-width':1.8});
el(g,'rect',{x:r+6,y:-width*.13,width:len-width-12,height:width*.26,rx:width*.12,fill:groove,stroke:mat==='blue'?'#778782':'#d6d5bd','stroke-width':1});return g}
const links=[bar(260,24,'blue','#2d3d3d'),bar(260,24,'blue','#2d3d3d'),bar(100,22,'bronze','#99824e'),...Array.from({length:4},()=>bar(100,17,'steel','#859082'))];
const pins=Array.from({length:5},()=>use(get('joints'),'pin',0,0));
const trails=[0,1].map(i=>{
 const id='fade'+i,gradient=el(document.querySelector('defs'),'linearGradient',{id,gradientUnits:'userSpaceOnUse',x1:588,x2:588});
 const stops=Array.from({length:17},()=>el(gradient,'stop',{'stop-color':'#d14321'}));
 return {gradient,stops,line:el(get('trail'),'line',{x1:588,x2:588,stroke:'url(#'+id+')','stroke-linecap':'butt'})}
});
function segment(i,start,end,now){
 const {gradient,stops,line}=trails[i],a=outputY(start),b=outputY(end);
 for(const n of [gradient,line]){n.setAttribute('y1',a);n.setAttribute('y2',b)}
 stops.forEach((n,k)=>{const s=start+(end-start)*k/16;
 n.setAttribute('offset',a===b?0:Math.min(1,Math.max(0,(outputY(s)-a)/(b-a))));
 n.setAttribute('stop-opacity',Math.max(0,1-(now-s)/1.5)**1.4)});
}
const mech=get('mechanics'),shadow=el(get('art'),'use',{href:'#mechanics',transform:'translate(3 6)',filter:'url(#soft)',opacity:'.33'});
// A silhouette shadow preserves light direction as the bars pivot.
const maskFilter=get('soft');maskFilter.insertBefore(el(maskFilter,'feColorMatrix',{type:'matrix',values:'0 0 0 0 0.02 0 0 0 0 0.04 0 0 0 0 0.03 0 0 0 1 0'}),maskFilter.firstChild);
mech.before(shadow);
const O=[300,450],Q=[400,450],angle=t=>Math.PI/3*Math.sin(2*Math.PI*(((t%6)+6)%6)/6);
const outputY=t=>450-288*Math.tan(angle(t)/2);
function frame(t){t=((t%6)+6)%6;const psi=angle(t),C=[400+100*Math.cos(psi),450-100*Math.sin(psi)];
const dx=C[0]-300,dy=C[1]-450,dist=Math.hypot(dx,dy),u=dx/dist,v=dy/dist;
const foot=(260**2-100**2+dist**2)/(2*dist),off=Math.sqrt(260**2-foot**2);
const A=[300+foot*u+off*v,450+foot*v-off*u],B=[300+foot*u-off*v,450+foot*v+off*u],P=[A[0]+B[0]-C[0],A[1]+B[1]-C[1]];
[[O,B],[O,A],[Q,C],[C,B],[B,P],[P,A],[A,C]].forEach(([a,b],i)=>{links[i].setAttribute('transform','translate('+a.join(' ')+') rotate('+Math.atan2(b[1]-a[1],b[0]-a[0])/rad+')')});
[O,Q,A,B,C].forEach((p,i)=>move(pins[i],...p));move(get('output'),...P);move(get('pLabel'),P[0]+17,P[1]-15);move(get('slide'),0,P[1]);
get('pointer').setAttribute('transform','translate(400 450) rotate('+(-psi/rad)+')');
const start=t-1.5,turn=1.5+3*Math.ceil((start-1.5)/3),split=turn>start && turn<t;segment(0,start,split?turn:t,t);trails[1].line.style.display=split?'':'none';if(split)segment(1,turn,t,t);}
const query=new URLSearchParams(location.search),start=performance.now();
if(query.has('t'))frame(Number(query.get('t'))||0);else{frame(0);requestAnimationFrame(function play(now){frame(((now-start)/1000)%6);requestAnimationFrame(play)})}
</script></body></html>
