  <title id="art-title">Straight-Line Linkage</title>
  <desc id="art-desc">A bronze and silver Peaucellier–Lipkin linkage rocks around two ground pivots on a dark machined plate. Its rhombus drives an orange pin and a slim readout arm along a vertical ruler, leaving a fading trace.</desc>
  <defs>

  <path d="M260 162H1339 M260 740H1339" stroke="#8d9e8e" stroke-opacity=".24"/>

  <path id="datum" d="M588 210V690" stroke="#b0c3b9" stroke-width="1.25"/>

  <path d="M1205 208H1324L1334 218V682L1324 692H1205Z" fill="url(#surface)" stroke="#0e1f25" stroke-width="1.4"/>
  <path d="M1205 209H1324L1334 219 M1206 691H1324L1333 682" stroke="#aec0ac" stroke-opacity=".29" fill="none"/>

  <path d="M244 449C244 418 269 392 300 392C323 392 331 405 350 405C369 405 378 392 400 392C432 392 456 418 456 449C456 480 432 506 400 506C378 506 369 493 350 493C331 493 323 506 300 506C269 506 244 480 244 449Z" fill="url(#mount)" stroke="url(#mount-edge)" stroke-width="1.4"/>
  <path d="M260 427C281 393 310 400 333 411Q350 419 367 411C393 397 423 397 442 427" stroke="#e0d9b2" stroke-opacity=".33" fill="none"/>

  <g font-size="20" font-weight="650" text-anchor="middle" fill="#ebdfc4">

  <g id="dial" fill="none">
    <path d="M475 320.096189 A150 150 0 0 1 475 579.903811" stroke="#aec3b7" stroke-opacity=".62" stroke-width="1.35"/>
    <path d="M479 313.167986 A158 158 0 0 1 479 586.832014" stroke="#6f918c" stroke-opacity=".34"/>
    <path id="dial-ticks" stroke="#b1c3b3" stroke-width="1.6"/>
    <g fill="#d8e0cc" font-size="16" font-weight="570" text-anchor="middle">
      <text x="449" y="264">+60</text><text x="531" y="470">0</text><text x="449" y="646">-60</text>
    </g>
  </g>
  <g id="needle">

    <path d="M161 0H168" stroke="#ddc499" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g id="shadow" filter="url(#cast)" opacity=".65">
    <g transform="translate(6 8)" fill="#060e12">

  </g>
  <g fill="none" stroke-width="4.5" stroke-linecap="round">

    <path id="trail-b" stroke="url(#tail-b)"/>
  </g>
  <g id="indicator">
    <use href="#readout" fill="url(#blade)" stroke="#121f25" stroke-width="1.7"/>
    <path d="M20-19.5H51.5L71.5-11.5H514L547-4.7L561-2" fill="none" stroke="#bbcac0" stroke-opacity=".75"/>
    <path d="M95 .8L105 7.1H510L536 .7" fill="none" stroke="#90a9a1" stroke-opacity=".56"/>

  </g>

  <g id="links">
    <use id="ob" href="#long-bar"/><use id="oa" href="#long-bar"/>
    <use id="qc" href="#crank-bar"/>
    <use id="cb" href="#short-bar"/><use id="bp" href="#short-bar"/>
    <use id="ac" href="#short-bar"/><use id="pa" href="#short-bar"/>
  </g>
  <g id="pins">
    <g transform="translate(300 450)">
      <circle r="18" fill="url(#pin)" stroke="#493c2d" stroke-width="1.6"/>
      <use href="#joint"/>
    </g>
    <g transform="translate(400 450)">
      <circle r="17" fill="url(#pin)" stroke="#263d3e" stroke-width="1.5"/>
      <use href="#joint"/>
    </g>
    <use id="joint-a" href="#joint"/><use id="joint-b" href="#joint"/><use id="joint-c" href="#joint"/>
    <g id="joint-p">
      <circle cy="2" r="16" fill="#15252b"/>
      <circle r="15.25" fill="#213339" stroke="#4d392b" stroke-width="1.5"/>
      <circle r="11.5" fill="#243237" stroke="#ff8651" stroke-width="3.1"/>
      <circle r="4.5" fill="#ff8651"/>
      <path d="M-8.5-7.5A11.3 11.3 0 0 1 3.5-10.8" fill="none" stroke="#ffd0a0" stroke-width="1.1"/>

<script>
  const duration = 6;
  const historyLength = 1.5;
  const get = id => document.getElementById(id);
  const set = (node, name, value) => node.setAttribute(name, value);
  const wrap = t => ((t % duration) + duration) % duration;
  const radians = degrees => degrees * Math.PI / 180;
  const phase = t => radians(60) * Math.sin(2 * Math.PI * wrap(t) / duration);
  const strokeY = t => 450 - 288 * Math.tan(phase(t) / 2);
  const O = {x:300, y:450};
  const Q = {x:400, y:450};

  const svgNode = (tag, attributes, parent) => {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [name, value] of Object.entries(attributes)) set(node, name, value);
    parent.appendChild(node);
    return node;
  };

  const grid = get("scale-grid");
  let gridLines = "";
  let ticks = "";
  let vernier = "";
  for (let y = 210; y <= 690; y += 40) {
    gridLines += "M603 " + y + "H1135";
    ticks += "M577 " + y + "H600";
  }
  for (let x = 628; x <= 1128; x += 40) {
    gridLines += "M" + x + " 210V690";
  }
  for (let y = 210; y <= 690; y += 10) {
    vernier += "M" + (y % 40 === 10 ? 1146 : 1152) + " " + y + "H1166";
  }
  svgNode("path", {d:gridLines, stroke:"url(#lines)"}, grid);
  svgNode("path", {d:ticks, stroke:"#b0c3b9", "stroke-opacity":".75"}, grid);
  svgNode("path", {d:vernier + "M1166 210V690", stroke:"#829f98", "stroke-opacity":".58"}, grid);

  const ribs = get("ribs");
  let channels = "";
  let edges = "";
  for (let x = 1228; x <= 1308; x += 10) {
    channels += "M" + x + " 252V648";
    edges += "M" + (x + 2) + " 253V647";
  }
  svgNode("path", {d:channels, stroke:"#09191f", "stroke-width":3, "stroke-linecap":"round"}, ribs);
  svgNode("path", {d:edges, stroke:"#7f9791", "stroke-opacity":".35"}, ribs);

  const polar = (radius, angle) => [Q.x + radius * Math.cos(angle), Q.y - radius * Math.sin(angle)];
  let dialTicks = "";
  for (let degrees = -60; degrees <= 60; degrees += 15) {
    const angle = radians(degrees);
    const start = polar(degrees % 30 === 0 ? 136 : 141, angle);
    const end = polar(150, angle);
    dialTicks += "M" + start.join(" ") + "L" + end.join(" ");
  }
  set(get("dial-ticks"), "d", dialTicks);

  const makeTrail = name => {
    const gradient = get("tail-" + name);
    return {
      gradient,
      path:get("trail-" + name),
      stops:Array.from({length:15}, () => svgNode("stop", {"stop-color":"#ff8651"}, gradient))
    };
  };
  const trailA = makeTrail("a");
  const trailB = makeTrail("b");
  function renderTrail(trail, start, end, historyStart) {
    const y1 = strokeY(start);
    const y2 = strokeY(end);
    if (Math.abs(y2 - y1) < 0.001) {
      set(trail.path, "d", "");
      return;
    }
    set(trail.gradient, "y1", y1);
    set(trail.gradient, "y2", y2);
    set(trail.path, "d", "M588 " + y1 + "V" + y2);
    trail.stops.forEach((stop, index) => {
      const time = start + (end - start) * index / (trail.stops.length - 1);
      const offset = (strokeY(time) - y1) / (y2 - y1);
      set(stop, "offset", Math.max(0, Math.min(1, offset)));
      set(stop, "stop-opacity", Math.pow(Math.max(0, (time - historyStart) / historyLength), 1.55));
    });
  }

  const bars = ["oa","ob","qc","ac","cb","bp","pa"].map(get);
  const jointA = get("joint-a");
  const jointB = get("joint-b");
  const jointC = get("joint-c");
  const jointP = get("joint-p");
  const blade = get("indicator");
  const bladeShadow = get("blade-shadow");
  const linkShadow = get("link-shadow");
  const needle = get("needle");
  const move = (node, point) => set(node, "transform", "translate(" + point.x + " " + point.y + ")");
  const orient = (node, from, to) => {
    const angle = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
    set(node, "transform", "translate(" + from.x + " " + from.y + ") rotate(" + angle + ")");
  };

  function render(t) {
    const psi = phase(t);
    const [cx, cy] = polar(100, psi);
    const C = {x:cx, y:cy};
    const dx = C.x - O.x;
    const dy = C.y - O.y;
    const distance = Math.hypot(dx, dy);
    const along = (260 ** 2 - 100 ** 2 + distance ** 2) / (2 * distance);
    const across = Math.sqrt(260 ** 2 - along ** 2);
    const foot = {x:O.x + along * dx / distance, y:O.y + along * dy / distance};
    // The perpendicular used for A points upward because C is always right of O.
    const A = {x:foot.x + across * dy / distance, y:foot.y - across * dx / distance};
    const B = {x:foot.x - across * dy / distance, y:foot.y + across * dx / distance};
    const P = {x:588, y:strokeY(t)};

    const links = [[O,A], [O,B], [Q,C], [A,C], [C,B], [B,P], [P,A]];
    let silhouette = "";
    links.forEach(([from,to], index) => {
      orient(bars[index], from, to);
      silhouette += "M" + from.x + " " + from.y + "L" + to.x + " " + to.y;
    });
    set(linkShadow, "d", silhouette);
    move(jointA, A);
    move(jointB, B);
    move(jointC, C);
    move(jointP, P);
    move(blade, P);
    move(bladeShadow, P);
    orient(needle, Q, C);

    const start = t - historyLength;
    const reversal = 1.5 + 3 * (Math.floor((start - 1.5) / 3) + 1);
    if (reversal < t) {
      renderTrail(trailA, start, reversal, start);
      renderTrail(trailB, reversal, t, start);
    } else {
      renderTrail(trailA, start, t, start);
      set(trailB.path, "d", "");
    }
  }

  const query = new URLSearchParams(location.search);
  if (query.has("t")) {
    const time = Number(query.get("t"));
    render(Number.isFinite(time) ? wrap(time) : 0);
  } else {
    const startTime = performance.now();
    render(0);
    function frame(now) {
      render(wrap((now - startTime) / 1000));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
</script>
