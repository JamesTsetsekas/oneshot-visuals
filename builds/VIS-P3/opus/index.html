<title id="ttl">Peaucellier-Lipkin straight-line linkage</title>
<desc id="dsc">An animated machined-steel Peaucellier-Lipkin inversor linkage bolted to a dark cast-iron surface plate. A blued crank swings sixty degrees each way about pivot Q, read on an engraved dial, while two long links from pivot O and a four-bar rhombus drive output point P, marked by an orange ring, straight up and down along a vertical ruled straightedge, leaving a fading orange trail.</desc>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var D = 6, OX = 300, OY = 450, QX = 400, QY = 450, LL = 260, LS = 100, RC = 100;
  var AMP = 60 * Math.PI / 180;
  var LX = -Math.SQRT1_2, LY = -Math.SQRT1_2; // light from upper-left
  function el(parent, name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function wrap(t) { t = t % D; if (t < 0) t += D; return t; }
  // pure kinematics: everything is a function of t
  function solve(t) {
    var psi = AMP * Math.sin(2 * Math.PI * t / D);
    var cx = QX + RC * Math.cos(psi), cy = QY - RC * Math.sin(psi);
    var dx = cx - OX, dy = cy - OY, d = Math.sqrt(dx * dx + dy * dy);
    var a = (d * d + LL * LL - LS * LS) / (2 * d);
    var h = Math.sqrt(Math.max(0, LL * LL - a * a));
    var ux = dx / d, uy = dy / d, mx = OX + a * ux, my = OY + a * uy;
    var p1x = mx + h * uy, p1y = my - h * ux, p2x = mx - h * uy, p2y = my + h * ux;
    var ax, ay, bx, by;
    if (p1y <= p2y) { ax = p1x; ay = p1y; bx = p2x; by = p2y; } else { ax = p2x; ay = p2y; bx = p1x; by = p1y; }
    return { psi: psi, C: [cx, cy], A: [ax, ay], B: [bx, by], P: [ax + bx - cx, ay + by - cy] };
  }
  // link factory
  var MAT = {
    steel: { body: "url(#gSteel)", eye: "url(#gSteelEye)", rim: "#1b1f24" },
    gun: { body: "url(#gGun)", eye: "url(#gGunEye)", rim: "#15181c" },
    blue: { body: "url(#gBlue)", eye: "url(#gBlueEye)", rim: "#0c1724" }
  };
  var shadowG = $("shadow");
  function makeLink(parent, w, mat) {
    var m = MAT[mat], er = w / 2 + 3.5;
    var o = {
      w: w,
      rim: el(parent, "line", { stroke: m.rim, "stroke-width": w + 3, "stroke-linecap": "round" }),
      body: el(parent, "line", { stroke: m.body, "stroke-width": w, "stroke-linecap": "round" }),
      hi: el(parent, "line", { stroke: "#fff", "stroke-opacity": ".32", "stroke-width": 3, "stroke-linecap": "round" }),
      lo: el(parent, "line", { stroke: "#000", "stroke-opacity": ".3", "stroke-width": 3, "stroke-linecap": "round" }),
      e1: el(parent, "circle", { r: er, fill: m.eye, stroke: m.rim, "stroke-width": 1.5 }),
      e2: el(parent, "circle", { r: er, fill: m.eye, stroke: m.rim, "stroke-width": 1.5 }),
      sl: el(shadowG, "line", { stroke: "#000", "stroke-width": w + 2, "stroke-linecap": "round" }),
      s1: el(shadowG, "circle", { r: er + 1, fill: "#000" }),
      s2: el(shadowG, "circle", { r: er + 1, fill: "#000" })
    };

  }
  function setLine(e, x1, y1, x2, y2) {
    e.setAttribute("x1", x1.toFixed(3)); e.setAttribute("y1", y1.toFixed(3));
    e.setAttribute("x2", x2.toFixed(3)); e.setAttribute("y2", y2.toFixed(3));
  }
  function setC(e, x, y) { e.setAttribute("cx", x.toFixed(3)); e.setAttribute("cy", y.toFixed(3)); }
  function placeLink(o, p, q) {
    var dx = q[0] - p[0], dy = q[1] - p[1], L = Math.sqrt(dx * dx + dy * dy);
    var nx = -dy / L, ny = dx / L;
    if (nx * LX + ny * LY < 0) { nx = -nx; ny = -ny; }

    setLine(o.body, p[0], p[1], q[0], q[1]);

    t = wrap(t);
    var s = solve(t), A = s.A, B = s.B, C = s.C, P = s.P;
    placeLink(crank, Q, C);
    placeLink(lOA, O, A); placeLink(lOB, O, B);
    placeLink(lAC, A, C); placeLink(lCB, C, B);
    placeLink(lPA, P, A); placeLink(lBP, B, P);
    placePin(pinA, A); placePin(pinB, B); placePin(pinC, C); placePin(pinP, P);
    pointer.setAttribute("transform", "rotate(" + (-s.psi * 180 / Math.PI).toFixed(4) + " 400 450)");
    setC(pGlow, P[0], P[1]); setC(pRing, P[0], P[1]); setC(pDot, P[0], P[1]);
    lblP.setAttribute("y", (P[1] + 9).toFixed(2));
    var prevY = solve(wrap(t - TR)).P[1];
    for (var i = 0; i < N; i++) {
      var y = (i === N - 1) ? P[1] : solve(wrap(t - TR + TR * (i + 1) / N)).P[1];
      seg[i].setAttribute("x1", P[0].toFixed(3)); seg[i].setAttribute("x2", P[0].toFixed(3));
      seg[i].setAttribute("y1", prevY.toFixed(3)); seg[i].setAttribute("y2", y.toFixed(3));
      prevY = y;
    }
  }

  var m = /[?&]t=([^&]*)/.exec(window.location.search);
  var tq = m ? parseFloat(decodeURIComponent(m[1])) : NaN;
  if (m && isFinite(tq)) {
    render(tq);
  } else {
    var tStart = performance.now();
    render(0);
    var frame = function () {
      render(((performance.now() - tStart) / 1000) % D);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
  window.__linkage = { solve: solve, render: render };
})();
