<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straight Line Linkage</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#131b20}
svg{display:block;width:100%;height:100%}
text{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-weight:500;fill:#c8d1d4;font-size:18px}
.bar{stroke-linecap:round}.hair{fill:none;stroke:#d7e1e3;stroke-opacity:.24}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
<title id="title">Straight Line Linkage</title>
<desc id="description">A precision steel inversor mounted on a dark instrument bed. Two fixed pivots support a swinging crank and articulated diamond. Its amber output joint traces a vertical straight line and drives an extended carriage along polished guide rails.</desc>
<defs>
 <radialGradient id="ambient"><stop stop-color="#28373e"/><stop offset="1" stop-color="#131b20"/></radialGradient>
 <linearGradient id="bed" x2="0" y2="1"><stop stop-color="#354248"/><stop offset=".06" stop-color="#29363c"/><stop offset="1" stop-color="#1b272d"/></linearGradient>
 <linearGradient id="edge" x2="0" y2="1"><stop stop-color="#748187"/><stop offset=".12" stop-color="#344249"/><stop offset="1" stop-color="#10191e"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#f0f3ed"/><stop offset=".27" stop-color="#acbabd"/><stop offset=".51" stop-color="#768b92"/><stop offset=".7" stop-color="#ced8d8"/><stop offset="1" stop-color="#6b7c83"/></linearGradient>
 <linearGradient id="darkSteel" x2=".2" y2="1"><stop stop-color="#8b9ba2"/><stop offset=".4" stop-color="#566b75"/><stop offset="1" stop-color="#344b56"/></linearGradient>
 <linearGradient id="rail"><stop stop-color="#29383f"/><stop offset=".25" stop-color="#8f9fa4"/><stop offset=".44" stop-color="#e3e8e3"/><stop offset=".6" stop-color="#809298"/><stop offset="1" stop-color="#24353d"/></linearGradient>
 <radialGradient id="pin" cx=".32" cy=".2"><stop stop-color="#e2e8e5"/><stop offset=".58" stop-color="#a3b1b5"/><stop offset=".82" stop-color="#687b84"/><stop offset="1" stop-color="#d6deda"/></radialGradient>
 <pattern id="grain" width="7" height="5" patternUnits="userSpaceOnUse"><path d="M0 .5H7" stroke="#e8f0f0" stroke-opacity=".025"/></pattern>
 <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V10" stroke="#a7b6bd" stroke-opacity=".25" stroke-width="2"/></pattern>
 <filter id="bedShadow" x="-.1" y="-.15" width="1.2" height="1.4"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shadow" x="-.1" y="-.15" width="1.2" height="1.3" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="5" dy="9" result="offset"/><feFlood flood-color="#050c10" flood-opacity=".65"/><feComposite in2="offset" operator="in"/></filter>
 <g id="bolt"><circle r="10" fill="#101b21"/><circle r="8" fill="url(#pin)" stroke="#75868c"/><path d="M-4 -2.3V2.3L0 4.6 4 2.3V-2.3L0-4.6Z" fill="#30424b"/><path d="M-3-2 0-3.8 3-2" fill="none" stroke="#0f1e26"/></g>
</defs>
<rect width="1600" height="900" fill="#131b20"/>
<ellipse cx="785" cy="447" rx="755" ry="425" fill="url(#ambient)"/>
<rect x="164" y="193" width="1128" height="551" rx="37" fill="#000" opacity=".46" filter="url(#bedShadow)"/>
<rect x="151" y="166" width="1138" height="569" rx="32" fill="url(#edge)" stroke="#0d171c" stroke-width="2"/>
<rect x="156" y="166" width="1128" height="555" rx="28" fill="url(#bed)" stroke="#75858b" stroke-opacity=".4"/>
<rect x="156" y="166" width="1128" height="555" rx="28" fill="url(#grain)"/>
<rect x="177" y="187" width="1086" height="513" rx="17" fill="none" stroke="#101e25"/>
<path d="M194 188H1246M177 204V681" class="hair"/>
<g id="bedBolts"></g>
<!-- Recessed fixed bearing pedestal. -->
<rect x="235" y="378" width="218" height="151" rx="28" fill="#0e1b22" opacity=".6"/>
<rect x="228" y="370" width="218" height="151" rx="28" fill="url(#edge)" stroke="#657880"/>
<rect x="237" y="380" width="200" height="130" rx="20" fill="#31444e" stroke="#1c2c34"/>
<rect x="248" y="470" width="174" height="26" rx="5" fill="url(#hatch)"/>
<g fill="#243741" stroke="#6e828c"><circle cx="300" cy="450" r="36"/><circle cx="400" cy="450" r="32"/></g>
<g stroke="#15262e" stroke-width="2" fill="none"><circle cx="300" cy="450" r="28"/><circle cx="400" cy="450" r="25"/></g>
<use href="#bolt" x="253" y="398"/><use href="#bolt" x="421" y="398"/>
<use href="#bolt" x="253" y="496"/><use href="#bolt" x="421" y="496"/>
<!-- The engraved angular and linear scales are below every moving part. -->
<g id="dial" fill="none" stroke="#9aafb8" stroke-opacity=".65">
 <path d="M475 320.096189 A150 150 0 0 1 475 579.903811"/>
</g>
<g font-size="16" text-anchor="middle"><text x="479" y="245">+60</text><text x="552" y="479">0</text><text x="479" y="668">-60</text></g>
<g id="rule" stroke="#a8bac0"><path d="M588 210V690" stroke-width="1" opacity=".7"/></g>
<!-- A rigid output extension makes the full-width slide assembly legible. -->
<rect x="1032" y="205" width="126" height="485" rx="18" fill="#12232b" stroke="#4a606b"/>
<path d="M1095 222V674" stroke="#0b1920" stroke-width="22"/>
<path d="M1090 227V672" stroke="#263c46" stroke-width="2"/>
<rect x="1050" y="223" width="14" height="447" rx="7" fill="url(#rail)"/>
<rect x="1125" y="223" width="14" height="447" rx="7" fill="url(#rail)"/>
<g fill="url(#darkSteel)" stroke="#84969d" stroke-width=".7"><rect x="1039" y="211" width="112" height="25" rx="6"/><rect x="1039" y="665" width="112" height="25" rx="6"/></g>
<use href="#bolt" x="1057" y="223"/><use href="#bolt" x="1132" y="223"/>
<use href="#bolt" x="1057" y="677"/><use href="#bolt" x="1132" y="677"/>
<g id="trail" fill="none" stroke="#ffb84d" stroke-width="5" stroke-linecap="round"></g>
<use href="#moving" filter="url(#shadow)"/>
<g id="moving">
 <g id="carriage">
  <rect x="1037" y="-39" width="115" height="78" rx="9" fill="url(#edge)" stroke="#8b9da3"/>
  <rect x="1043" y="-31" width="103" height="62" rx="5" fill="url(#darkSteel)"/>
  <path d="M588-10H1023L1069-23H1110V23H1069L1023 10H588Z" fill="url(#darkSteel)" stroke="#9baeb5" stroke-width="1"/>
  <path d="M624-5H1018L1072-17H1101" fill="none" stroke="#c5d2d6" stroke-opacity=".45"/>
  <path d="M637 4H1017" stroke="#1d323d" stroke-width="2"/>
  <use href="#bolt" x="1094" y="0"/>
  <path d="M1045-25H1065M1122-25H1143M1045 25H1065M1122 25H1143" stroke="#a9b9bf" stroke-opacity=".5"/>
 </g>
 <g id="pointer"><path d="M400 450H548" stroke="#b7c6cb" stroke-width="2"/><path d="M550 450 540 446 540 454Z" fill="#d3dddd"/></g>
 <g id="links"></g>
 <g id="pins"></g>
 <g id="output"><circle r="16" fill="#1b2a31" stroke="#ffb84d" stroke-width="3.5"/><circle r="9.5" fill="url(#pin)"/><circle r="4.2" fill="#ffb84d"/><path d="M-8-14A16 16 0 0 1 10-12" fill="none" stroke="#ffe5ad" stroke-width="1"/></g>
</g>
<text x="270" y="488">O</text><text x="384" y="491">Q</text><text id="pLabel" fill="#ffcb7a">P</text>
</svg>
<script>
'use strict';
(() => {
 const NS='http://www.w3.org/2000/svg';
 const el=(name,attrs,parent)=>{const n=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n};
 const get=id=>document.getElementById(id);
 for(const [x,y] of [[198,210],[1241,210],[198,677],[1241,677]])el('use',{href:'#bolt',x,y},get('bedBolts'));
 for(let d=-60;d<=60;d+=15){const a=d*Math.PI/180,r=d%30===0?139:143;el('line',{x1:400+r*Math.cos(a),y1:450-r*Math.sin(a),x2:400+150*Math.cos(a),y2:450-150*Math.sin(a),'stroke-width':d===0?2:1},get('dial'));}
 for(let y=210;y<=690;y+=40)el('path',{d:`M580 ${y}H596`,'stroke-width':1,opacity:.6},get('rule'));
 const pairs=[['O','A'],['O','B'],['Q','C'],['A','C'],['C','B'],['B','P'],['P','A']];
 const bars=pairs.map((pair,i)=>{const g=el('g',{},get('links'));return [pair,[el('line',{class:'bar',stroke:'#12252e','stroke-width':25},g),el('line',{class:'bar',stroke:i<2?'url(#darkSteel)':'url(#steel)','stroke-width':21},g),el('line',{class:'bar',stroke:i<2?'#c4d5dc':'#f1f4ed','stroke-width':1,'stroke-opacity':.4},g)]]});
 const pins={};for(const name of ['O','Q','A','B','C']){const g=el('g',{},get('pins'));el('circle',{r:name==='O'?19:15,fill:'#21343e',stroke:'#b3c3c8','stroke-width':1},g);el('circle',{r:11,fill:'url(#pin)',stroke:'#112630','stroke-width':1.5},g);el('circle',{r:4,fill:'#314852',stroke:'#d0dada','stroke-width':.7},g);el('path',{d:'M-2-2L2 2',stroke:'#172a34','stroke-width':1.4},g);pins[name]=g;}
 const trail=Array.from({length:120},(_,i)=>el('path',{'stroke-opacity':Math.pow((i+1)/120,1.8)},get('trail')));
 function geometry(t){const psi=Math.PI/3*Math.sin(2*Math.PI*t/6),O={x:300,y:450},Q={x:400,y:450},C={x:400+100*Math.cos(psi),y:450-100*Math.sin(psi)};
  const dx=C.x-O.x,dy=C.y-O.y,d=Math.hypot(dx,dy),a=(260*260-100*100+d*d)/(2*d),h=Math.sqrt(260*260-a*a),mx=O.x+a*dx/d,my=O.y+a*dy/d;
  const A={x:mx+h*dy/d,y:my-h*dx/d},B={x:mx-h*dy/d,y:my+h*dx/d},P={x:A.x+B.x-C.x,y:A.y+B.y-C.y};return {O,Q,A,B,C,P,psi};
 }
 function frame(t){t=((t%6)+6)%6;const p=geometry(t);
  for(const [[a,b],lines] of bars)for(const line of lines){line.setAttribute('x1',p[a].x);line.setAttribute('y1',p[a].y);line.setAttribute('x2',p[b].x);line.setAttribute('y2',p[b].y);}
  for(const [name,pin] of Object.entries(pins))pin.setAttribute('transform',`translate(${p[name].x} ${p[name].y})`);
  get('output').setAttribute('transform',`translate(${p.P.x} ${p.P.y})`);get('carriage').setAttribute('transform',`translate(0 ${p.P.y})`);
  get('pointer').setAttribute('transform',`rotate(${-p.psi*180/Math.PI} 400 450)`);
  get('pLabel').setAttribute('x',p.P.x+25);get('pLabel').setAttribute('y',p.P.y-21);
  for(let i=0;i<trail.length;i++){const a=geometry(((t-1.5+i*1.5/120)%6+6)%6).P,b=geometry(((t-1.5+(i+1)*1.5/120)%6+6)%6).P;trail[i].setAttribute('d',`M${a.x} ${a.y}L${b.x} ${b.y}`);}
 }
 const q=new URLSearchParams(location.search),s=q.get('t');
 if(s!==null&&Number.isFinite(Number(s))){frame(Number(s));}else{const start=performance.now();frame(0);const loop=now=>{frame(((now-start)/1000)%6);requestAnimationFrame(loop)};requestAnimationFrame(loop);}
})();
</script>
</body>
</html>
