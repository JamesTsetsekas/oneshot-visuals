<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Rail Pendulum Wave</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#090d18}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#e8eefb}
[hidden]{display:none!important}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:default}
#stage text{font-family:system-ui,"Segoe UI",Arial,sans-serif;pointer-events:none}
.t-title{font-size:20px;font-weight:700;letter-spacing:.34em;fill:#eef3ff}
.t-sub{font-size:13px;font-weight:500;letter-spacing:.04em;fill:#a3b3cf}
.t-cap{font-size:12px;font-weight:600;letter-spacing:.1em;fill:#a3b3cf}
.rod{stroke:#8494b6;stroke-width:3;stroke-linecap:round}
.rod.held{stroke:#ffffff}
.bob{stroke:#060a14;stroke-width:1.5}
.bob.held{stroke:#ffffff;stroke-width:2.5}
.halo{pointer-events:none}
.ring{display:none;fill:none;stroke:#ffffff;pointer-events:none}
.ring.hover{display:block;stroke-width:1.6;opacity:.85}
.ring.held{display:block;stroke-width:3.2}
.fixedOnly{transition:opacity .25s}
#stage.free .fixedOnly{opacity:0}
.ghost{fill:none;stroke:#86aaff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hud{position:fixed;left:0;top:0;width:1600px;height:100px;transform-origin:0 0;pointer-events:none;-webkit-user-select:none;user-select:none}
.bar{position:absolute;left:76px;right:76px;top:8px;bottom:8px;box-sizing:border-box;padding:0 18px;display:flex;align-items:center;gap:26px;background:#111829;border:1px solid #2a3654;border-radius:16px;pointer-events:auto}
.grp{display:flex;flex-direction:column;gap:7px;flex:none}
.cap{font:600 12px/14px system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#a3b3cf;white-space:nowrap}
.cap b{color:#f3f6ff;font-weight:700;margin-left:8px;letter-spacing:.03em;text-transform:none}
.row{display:flex;gap:6px}
button{-webkit-appearance:none;appearance:none;margin:0;box-sizing:border-box;height:40px;padding:0 10px;border:1px solid #3a4970;border-radius:10px;background:#18213a;color:#e8eefb;font:600 15px/1 system-ui,"Segoe UI",Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer}
button:hover{background:#22305a;border-color:#5a6ea3}
button:active{background:#2a3a6a}
button:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
button[aria-pressed="true"]{background:#dfe8ff;border-color:#dfe8ff;color:#0a1022}
kbd{font:700 12px/1 ui-monospace,Consolas,monospace;min-width:10px;padding:5px 6px;border:1px solid currentColor;border-radius:5px;text-align:center}
.wD{width:112px}.wE{width:196px}.wP{width:170px}.wR{width:112px}
.opt{color:#a3b3cf}
.opt.on{color:#ffffff;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.sep{color:#8fa0c0}
.status{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
#pausedTag{font:800 15px/1 system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.2em;color:#1a1000;background:#ffb44f;padding:7px 10px 7px 13px;border-radius:7px;white-space:nowrap}
#hint{font:500 15px/18px system-ui,"Segoe UI",Arial,sans-serif;color:#dbe6ff;white-space:nowrap}
.energy{flex:none;width:250px;text-align:right;display:flex;flex-direction:column;gap:4px}
#E{font:600 30px/36px ui-monospace,Consolas,monospace;color:#f5f8ff;white-space:pre;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ripple Rail: a row of 25 coupled pendulums you can drag">
<desc>A dark stage with a horizontal rail carrying twenty-five pendulums on long rods. Each bob is tinted from blue through pale steel to orange by its angular velocity, a pale ribbon runs through all the bob centres, and a coloured trace below plots every pendulum angle so travelling and reflecting waves are easy to follow.</desc>
<defs>
<radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#1b2748" stop-opacity="0.85"/>
<stop offset="0.6" stop-color="#121a32" stop-opacity="0.45"/>
<stop offset="1" stop-color="#090d18" stop-opacity="0"/>
</radialGradient>
<linearGradient id="railG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8794b4"/>
<stop offset="0.45" stop-color="#4c5878"/>
<stop offset="1" stop-color="#222a44"/>
</linearGradient>
<linearGradient id="legendG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="rgb(40,160,255)"/>
<stop offset="0.5" stop-color="rgb(214,222,238)"/>
<stop offset="1" stop-color="rgb(255,146,40)"/>
</linearGradient>
<radialGradient id="haloW">
<stop offset="0" stop-color="rgb(255,146,40)" stop-opacity="0.6"/>
<stop offset="0.45" stop-color="rgb(255,146,40)" stop-opacity="0.2"/>
<stop offset="1" stop-color="rgb(255,146,40)" stop-opacity="0"/>
</radialGradient>
<radialGradient id="haloC">
<stop offset="0" stop-color="rgb(40,160,255)" stop-opacity="0.6"/>
<stop offset="0.45" stop-color="rgb(40,160,255)" stop-opacity="0.2"/>
<stop offset="1" stop-color="rgb(40,160,255)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="profG" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="1472" y2="0"></linearGradient>
</defs>

<rect x="0" y="0" width="1600" height="900" fill="#090d18"/>
<ellipse cx="800" cy="410" rx="800" ry="410" fill="url(#bgGlow)"/>

<text class="t-title" x="88" y="50">RIPPLE RAIL</text>
<text class="t-sub" x="88" y="74">25 coupled pendulums · k = 60 · ω² = 4</text>

<text class="t-cap" x="1512" y="42" text-anchor="end">BOB COLOUR · ANGULAR VELOCITY, rad/s</text>
<rect x="1292" y="52" width="220" height="8" rx="4" fill="url(#legendG)"/>
<path d="M1292 63v4M1402 63v4M1512 63v4" stroke="#a3b3cf" stroke-width="1.2" fill="none"/>
<text class="t-sub" x="1292" y="82">−1.5 left</text>
<text class="t-sub" x="1402" y="82" text-anchor="middle">0</text>
<text class="t-sub" x="1512" y="82" text-anchor="end">right +1.5</text>

<line x1="88" y1="620" x2="1512" y2="620" stroke="#8ea2cc" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round"/>

<g id="profile">
<line x1="72" y1="712" x2="1528" y2="712" stroke="#8ea2cc" stroke-opacity="0.3" stroke-width="1.2"/>
<path id="profTicks" stroke="#8ea2cc" stroke-opacity="0.4" stroke-width="1.2" fill="none"/>
<path id="profFill" fill="url(#profG)" fill-opacity="0.16" stroke="none"/>
<path id="profLine" fill="none" stroke="url(#profG)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g class="fixedOnly"><circle cx="72" cy="712" r="3.5" fill="#dfe7fa"/><circle cx="1528" cy="712" r="3.5" fill="#dfe7fa"/></g>
<text class="t-cap" x="72" y="776">ANGLE PROFILE θ · COLOURED BY ANGULAR VELOCITY</text>
</g>

<g class="fixedOnly" stroke="#5f6f95" stroke-width="3" stroke-linecap="round">
<line x1="90" y1="106" x2="90" y2="210"/><line x1="1510" y1="106" x2="1510" y2="210"/>
<circle cx="90" cy="210" r="4" fill="#c5d0ea" stroke="none"/><circle cx="1510" cy="210" r="4" fill="#c5d0ea" stroke="none"/>
</g>
<path id="thread" fill="none" stroke="#6d86bd" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

<g id="rods"></g>
<path id="gh2" class="ghost" stroke-opacity="0.09"/>
<path id="gh1" class="ghost" stroke-opacity="0.17"/>
<path id="gh0" class="ghost" stroke-opacity="0.28"/>
<path id="ribGlow" fill="none" stroke="#bcd0ff" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<g id="halos"></g>
<path id="ribbon" fill="none" stroke="#f1f5ff" stroke-opacity="0.95" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g id="bobs"></g>
<g id="rings"></g>

<rect x="88" y="94" width="1424" height="12" rx="3" fill="url(#railG)"/>
<line x1="91" y1="95.5" x2="1509" y2="95.5" stroke="#c9d4ee" stroke-opacity="0.45" stroke-width="1"/>
<g id="pivots"></g>
</svg>

<div id="hud" role="group" aria-label="Ripple Rail controls and readouts">
<div class="bar">
<div class="grp">
<div class="cap">Damping<b id="dampOut">level 2 · g = 0.25</b></div>
<div class="row" role="group" aria-label="Damping level">
<button type="button" class="wD" id="d1" aria-pressed="false" aria-label="Damping level 1, g 0.00, key 1"><kbd>1</kbd><span>g 0.00</span></button>
<button type="button" class="wD" id="d2" aria-pressed="true" aria-label="Damping level 2, g 0.25, key 2"><kbd>2</kbd><span>g 0.25</span></button>
<button type="button" class="wD" id="d3" aria-pressed="false" aria-label="Damping level 3, g 1.20, key 3"><kbd>3</kbd><span>g 1.20</span></button>
</div>
</div>
<div class="grp">
<div class="cap">Ends<b id="endsOut">Fixed</b></div>
<button type="button" class="wE" id="bEnds" aria-label="Ends: Fixed. Toggle Fixed or Free, key F"><kbd>F</kbd><span class="opt on" id="optFixed">Fixed</span><span class="sep">/</span><span class="opt" id="optFree">Free</span></button>
</div>
<div class="grp">
<div class="cap">Motion<b id="runOut">running</b></div>
<div class="row">
<button type="button" class="wP" id="bPause" aria-pressed="false" aria-label="Pause or resume, key Space"><kbd>Space</kbd><span id="pauseLbl">Pause</span></button>
<button type="button" class="wR" id="bReset" aria-label="Reset to rest, key R"><kbd>R</kbd><span>Reset</span></button>
</div>
</div>
<div class="status">
<span id="pausedTag" hidden>PAUSED</span>
<span id="hint">Drag a bob and let go</span>
</div>
<div class="energy">
<div class="cap">Energy · rad²/s²</div>
<div id="E">E = 0.00</div>
</div>
</div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- constants (binding numbers from the brief) ---------- */
  var N = 25, XC = 800, SP = 56, PY = 100, L = 520, W2 = 4.0, K = 60.0;
  var DT = 1 / 480;                      /* fixed step, RK4 */
  var GS = [0.0, 0.25, 1.2];
  var CLAMP = 80 * Math.PI / 180, GRAB = 30, BOB_R = 18;
  var VMAX = 1.5;                        /* colour scale: +/- 1.5 rad/s */
  var RT = 110;                          /* coupling-thread radius along the rod */
  var PB = 712, PS = 56, PLIM = 62;      /* angle-profile baseline, units per radian, display limit */
  var HN = 128, LAGS = [16, 32, 48];     /* history (steps) for ghost ribbons */
  var LEVELS = 41, HALF = 20;

  var stage = document.getElementById('stage');
  var hud = document.getElementById('hud');
  var NS = stage.namespaceURI;
  function $(id) { return document.getElementById(id); }
  function mk(name, attrs, parent) {
    var e = document.createElementNS(NS, name), k;
    for (k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* ---------- state ---------- */
  var th = new Float64Array(N), om = new Float64Array(N), thPrev = new Float64Array(N);
  var held = new Uint8Array(N), tgt = new Float64Array(N);
  var xs = new Float64Array(N);
  var i;
  for (i = 0; i < N; i++) xs[i] = XC + SP * (i - 12);

  var level = 2, g = GS[1], free = false, paused = false, touched = false;
  var acc = 0, last = 0, lastE = -1e9, nSteps = 0;
  var H = new Float64Array(HN * N), head = 0;

  /* RK4 scratch */
  var k1t = new Float64Array(N), k1o = new Float64Array(N), k2t = new Float64Array(N), k2o = new Float64Array(N);
  var k3t = new Float64Array(N), k3o = new Float64Array(N), k4t = new Float64Array(N), k4o = new Float64Array(N);
  var st = new Float64Array(N), so = new Float64Array(N);

  function deriv(a, w, da, dw) {
    var lft, rgt, j;
    for (j = 0; j < N; j++) {
      if (held[j]) { da[j] = 0; dw[j] = 0; continue; }
      lft = j > 0 ? a[j - 1] : (free ? a[0] : 0);
      rgt = j < N - 1 ? a[j + 1] : (free ? a[N - 1] : 0);
      da[j] = w[j];
      dw[j] = -W2 * Math.sin(a[j]) + K * (rgt - 2 * a[j] + lft) - g * w[j];
    }
  }

  function step() {
    var j, h2 = DT * 0.5, h6 = DT / 6;
    for (j = 0; j < N; j++) if (held[j]) { th[j] = tgt[j]; om[j] = 0; }
    thPrev.set(th);
    deriv(th, om, k1t, k1o);
    for (j = 0; j < N; j++) { st[j] = th[j] + h2 * k1t[j]; so[j] = om[j] + h2 * k1o[j]; }
    deriv(st, so, k2t, k2o);
    for (j = 0; j < N; j++) { st[j] = th[j] + h2 * k2t[j]; so[j] = om[j] + h2 * k2o[j]; }
    deriv(st, so, k3t, k3o);
    for (j = 0; j < N; j++) { st[j] = th[j] + DT * k3t[j]; so[j] = om[j] + DT * k3o[j]; }
    deriv(st, so, k4t, k4o);
    for (j = 0; j < N; j++) {
      th[j] += h6 * (k1t[j] + 2 * k2t[j] + 2 * k3t[j] + k4t[j]);
      om[j] += h6 * (k1o[j] + 2 * k2o[j] + 2 * k3o[j] + k4o[j]);
    }
    head = (head + 1) % HN;
    H.set(th, head * N);
    nSteps++;
  }

  function energy() {
    var e = 0, j, d;
    for (j = 0; j < N; j++) e += 0.5 * om[j] * om[j] + W2 * (1 - Math.cos(th[j]));
    for (j = 0; j < N - 1; j++) { d = th[j + 1] - th[j]; e += 0.5 * K * d * d; }
    if (!free) e += 0.5 * K * (th[0] * th[0] + th[N - 1] * th[N - 1]);
    return e;
  }

  function flattenHistory() {
    var j;
    thPrev.set(th);
    for (j = 0; j < HN; j++) H.set(th, j * N);
  }

  /* ---------- colour scale ---------- */
  var NEU = [214, 222, 238], COOL = [40, 160, 255], WARM = [255, 146, 40];
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgb(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
  var LV = [], defs = stage.querySelector('defs');
  (function () {
    var k, c, base, gr;
    for (k = 0; k < LEVELS; k++) {
      c = k / HALF - 1;
      base = mix(NEU, c < 0 ? COOL : WARM, Math.abs(c));
      LV.push(rgb(base));
      gr = mk('radialGradient', { id: 'b' + k, cx: '0.36', cy: '0.3', r: '0.8' }, defs);
      mk('stop', { offset: '0', 'stop-color': rgb(mix(base, [255, 255, 255], 0.72)) }, gr);
      mk('stop', { offset: '0.38', 'stop-color': rgb(base) }, gr);
      mk('stop', { offset: '1', 'stop-color': rgb(mix(base, [6, 9, 20], 0.66)) }, gr);
    }
  })();
  function levelOf(w) {
    var c = w / VMAX;
    if (c > 1) c = 1; else if (c < -1) c = -1;
    return Math.round((c + 1) * HALF);
  }

  /* ---------- build the picture ---------- */
  var rods = [], halos = [], bobs = [], rings = [], stops = [];
  var gRods = $('rods'), gHalos = $('halos'), gBobs = $('bobs'), gRings = $('rings'), gPiv = $('pivots'), profG = $('profG');
  var ticks = '';
  for (i = 0; i < N; i++) {
    rods.push(mk('line', { 'class': 'rod', x1: xs[i], y1: PY, x2: xs[i], y2: PY + L }, gRods));
    halos.push(mk('circle', { 'class': 'halo', cx: xs[i], cy: PY + L, r: 46, fill: 'url(#haloW)', opacity: 0 }, gHalos));
    bobs.push(mk('circle', { 'class': 'bob', 'data-index': i, cx: xs[i], cy: PY + L, r: BOB_R, fill: 'url(#b' + HALF + ')' }, gBobs));
    rings.push(mk('circle', { 'class': 'ring', cx: xs[i], cy: PY + L, r: 26 }, gRings));
    mk('circle', { cx: xs[i], cy: PY, r: 6, fill: '#0c1222', stroke: '#c3cfea', 'stroke-width': 1.6 }, gPiv);
    mk('circle', { cx: xs[i], cy: PY, r: 1.8, fill: '#e6edfc' }, gPiv);
    stops.push(mk('stop', { offset: (i / (N - 1)).toFixed(5), 'stop-color': LV[HALF] }, profG));
    ticks += 'M' + xs[i] + ' ' + (PB - 3) + 'v6';
  }
  $('profTicks').setAttribute('d', ticks);

  var elRibbon = $('ribbon'), elRibGlow = $('ribGlow'), elThread = $('thread');
  var elProfLine = $('profLine'), elProfFill = $('profFill');
  var elGhost = [$('gh0'), $('gh1'), $('gh2')];

  /* render caches so unchanged attributes are not rewritten */
  var cBx = new Float64Array(N), cBy = new Float64Array(N), cLv = new Int16Array(N), cHo = new Float64Array(N);
  var cHs = new Int8Array(N), cRing = new Int8Array(N), cStop = new Int16Array(N);
  var cPath = {};
  for (i = 0; i < N; i++) { cBx[i] = NaN; cBy[i] = NaN; cLv[i] = HALF; cHo[i] = 0; cHs[i] = 1; cRing[i] = 0; cStop[i] = HALF; }

  var ang = new Float64Array(N), bx = new Float64Array(N), by = new Float64Array(N);
  var tx = new Float64Array(N + 2), ty = new Float64Array(N + 2);

  function r2(v) { return Math.round(v * 100) / 100; }
  /* Catmull-Rom spline through the points, written as cubic Beziers */
  function curve(px, py, n) {
    var s = 'M' + r2(px[0]) + ' ' + r2(py[0]), a, a0, a2, a3;
    for (a = 0; a < n - 1; a++) {
      a0 = a > 0 ? a - 1 : 0; a2 = a + 1; a3 = a + 2 < n ? a + 2 : n - 1;
      s += 'C' + r2(px[a] + (px[a2] - px[a0]) / 6) + ' ' + r2(py[a] + (py[a2] - py[a0]) / 6) + ' ' +
        r2(px[a2] - (px[a3] - px[a]) / 6) + ' ' + r2(py[a2] - (py[a3] - py[a]) / 6) + ' ' +
        r2(px[a2]) + ' ' + r2(py[a2]);
    }
    return s;
  }
  function setPath(el, key, d) {
    if (cPath[key] !== d) { cPath[key] = d; el.setAttribute('d', d); }
  }

  var hoverIdx = -1, hoverX = 0, hoverY = 0, hoverOn = false, nHeld = 0, curCursor = 'default';

  function render(alpha) {
    var j, a, x, y, lv, ho, sg, rs, n, q, ia, ib, d, lag, w;
    for (j = 0; j < N; j++) {
      a = held[j] ? th[j] : thPrev[j] + (th[j] - thPrev[j]) * alpha;
      ang[j] = a;
      bx[j] = x = xs[j] + L * Math.sin(a);
      by[j] = y = PY + L * Math.cos(a);
      if (x !== cBx[j] || y !== cBy[j]) {
        cBx[j] = x; cBy[j] = y;
        var sx = r2(x), sy = r2(y);
        rods[j].setAttribute('x2', sx); rods[j].setAttribute('y2', sy);
        bobs[j].setAttribute('cx', sx); bobs[j].setAttribute('cy', sy);
        halos[j].setAttribute('cx', sx); halos[j].setAttribute('cy', sy);
        if (cRing[j]) { rings[j].setAttribute('cx', sx); rings[j].setAttribute('cy', sy); }
      }
      w = om[j];
      lv = levelOf(w);
      if (lv !== cLv[j]) { cLv[j] = lv; bobs[j].setAttribute('fill', 'url(#b' + lv + ')'); }
      if (lv !== cStop[j]) { cStop[j] = lv; stops[j].setAttribute('stop-color', LV[lv]); }
      ho = Math.abs(w) / VMAX; if (ho > 1) ho = 1;
      ho = Math.round(ho * 100) / 100;
      sg = w < 0 ? -1 : 1;
      if (sg !== cHs[j] && ho > 0) { cHs[j] = sg; halos[j].setAttribute('fill', sg < 0 ? 'url(#haloC)' : 'url(#haloW)'); }
      if (ho !== cHo[j]) { cHo[j] = ho; halos[j].setAttribute('opacity', ho); }
      rs = held[j] ? 2 : (j === hoverIdx ? 1 : 0);
      if (rs !== cRing[j]) {
        cRing[j] = rs;
        rings[j].setAttribute('class', rs === 2 ? 'ring held' : rs === 1 ? 'ring hover' : 'ring');
        rings[j].setAttribute('r', rs === 2 ? 28 : 26);
        rings[j].setAttribute('cx', r2(x)); rings[j].setAttribute('cy', r2(y));
        bobs[j].setAttribute('class', rs === 2 ? 'bob held' : 'bob');
        rods[j].setAttribute('class', rs === 2 ? 'rod held' : 'rod');
      }
    }

    d = curve(bx, by, N);
    setPath(elRibbon, 'r', d);
    setPath(elRibGlow, 'g', d);

    /* ghost ribbons: the same curve a few hundredths of a second ago */
    for (q = 0; q < 3; q++) {
      lag = LAGS[q];
      ib = ((head - lag) % HN + HN) % HN; ia = (ib + HN - 1) % HN;
      for (j = 0; j < N; j++) {
        a = H[ia * N + j]; a += (H[ib * N + j] - a) * alpha;
        tx[j] = xs[j] + L * Math.sin(a); ty[j] = PY + L * Math.cos(a);
      }
      setPath(elGhost[q], 'h' + q, curve(tx, ty, N));
    }

    /* coupling thread */
    n = 0;
    if (!free) { tx[n] = 90; ty[n] = PY + RT; n++; }
    for (j = 0; j < N; j++) { tx[n] = xs[j] + RT * Math.sin(ang[j]); ty[n] = PY + RT * Math.cos(ang[j]); n++; }
    if (!free) { tx[n] = 1510; ty[n] = PY + RT; n++; }
    setPath(elThread, 't', curve(tx, ty, n));

    /* angle profile, including the boundary condition at each end */
    for (j = 0; j < N; j++) {
      y = PS * ang[j]; if (y > PLIM) y = PLIM; else if (y < -PLIM) y = -PLIM;   /* extreme drags flatten at the strip edge */
      tx[j + 1] = xs[j]; ty[j + 1] = PB - y;
    }
    tx[0] = 72; ty[0] = free ? ty[1] : PB;
    tx[N + 1] = 1528; ty[N + 1] = free ? ty[N] : PB;
    d = curve(tx, ty, N + 2);
    setPath(elProfLine, 'p', d);
    setPath(elProfFill, 'f', d + 'L1528 ' + PB + 'L72 ' + PB + 'Z');
  }

  /* ---------- HUD ---------- */
  var elE = $('E'), elDamp = $('dampOut'), elEnds = $('endsOut'), elRun = $('runOut');
  var elPaused = $('pausedTag'), elHint = $('hint'), elPauseLbl = $('pauseLbl');
  var bD = [$('d1'), $('d2'), $('d3')], bEnds = $('bEnds'), bPause = $('bPause'), bReset = $('bReset');
  var cE = '';
  function showE() {
    var s = 'E = ' + energy().toFixed(2);
    if (s !== cE) { cE = s; elE.textContent = s; }
  }
  function setDamp(lv) {
    var j;
    level = lv; g = GS[lv - 1];
    for (j = 0; j < 3; j++) bD[j].setAttribute('aria-pressed', j === lv - 1 ? 'true' : 'false');
    elDamp.textContent = 'level ' + lv + ' · g = ' + g.toFixed(2);
  }
  function setEnds(f) {
    free = f;
    stage.setAttribute('class', f ? 'free' : '');
    elEnds.textContent = f ? 'Free' : 'Fixed';
    $('optFixed').className = f ? 'opt' : 'opt on';
    $('optFree').className = f ? 'opt on' : 'opt';
    bEnds.setAttribute('aria-label', 'Ends: ' + (f ? 'Free' : 'Fixed') + '. Toggle Fixed or Free, key F');
    showE();
  }
  function setPaused(p) {
    paused = p;
    elPaused.hidden = !p;
    elPauseLbl.textContent = p ? 'Resume' : 'Pause';
    elRun.textContent = p ? 'paused' : 'running';
    bPause.setAttribute('aria-pressed', p ? 'true' : 'false');
  }
  function reset() {
    var j;
    for (j = 0; j < N; j++) { th[j] = 0; om[j] = 0; }
    for (j = 0; j < N; j++) if (held[j]) th[j] = tgt[j];   /* a bob still in the hand stays in the hand */
    acc = 0;
    flattenHistory();
    showE();
  }

  bD[0].addEventListener('click', function () { setDamp(1); });
  bD[1].addEventListener('click', function () { setDamp(2); });
  bD[2].addEventListener('click', function () { setDamp(3); });
  bEnds.addEventListener('click', function () { setEnds(!free); });
  bPause.addEventListener('click', function () { setPaused(!paused); });
  bReset.addEventListener('click', reset);

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === '1' || k === '2' || k === '3') { setDamp(+k); }
    else if (k === 'f' || k === 'F') { if (!e.repeat) setEnds(!free); }
    else if (k === ' ' || e.code === 'Space') { if (!e.repeat) setPaused(!paused); }
    else if (k === 'r' || k === 'R') { if (!e.repeat) reset(); }
    else return;
    e.preventDefault();
  });
  /* Space is the global pause key, so it must not also "click" a focused button on key-up */
  window.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.code === 'Space') e.preventDefault();
  });

  /* ---------- pointer interaction ---------- */
  var sc = 1, ox = 0, oy = 0;
  function layout() {
    var m = stage.getScreenCTM();
    if (!m || !m.a) return;
    sc = m.a; ox = m.e; oy = m.f;
    hud.style.transform = 'translate(' + ox + 'px,' + (oy + 780 * sc) + 'px) scale(' + sc + ')';
  }
  window.addEventListener('resize', layout);
  layout();

  function nearest(px, py) {
    var best = -1, bd = GRAB * GRAB, j, dx, dy, d2;
    for (j = 0; j < N; j++) {
      dx = px - (xs[j] + L * Math.sin(th[j])); dy = py - (PY + L * Math.cos(th[j]));
      d2 = dx * dx + dy * dy;
      if (d2 <= bd) { bd = d2; best = j; }
    }
    return best;
  }
  function aim(j, px, py) {
    var a = Math.atan2(px - xs[j], py - PY);
    if (a > CLAMP) a = CLAMP; else if (a < -CLAMP) a = -CLAMP;
    tgt[j] = a; th[j] = a; om[j] = 0;
    if (paused) flattenHistory();
  }
  var ptrs = {};
  function release(id) {
    var j = ptrs[id];
    if (j === undefined) return;
    delete ptrs[id];
    held[j] = 0; om[j] = 0; nHeld--;
    showE();
  }
  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var px = (e.clientX - ox) / sc, py = (e.clientY - oy) / sc;
    if (e.pointerType !== 'touch') { hoverOn = true; hoverX = px; hoverY = py; }
    var j = nearest(px, py);
    if (j < 0 || held[j] || ptrs[e.pointerId] !== undefined) return;
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointers cannot be captured */ }
    ptrs[e.pointerId] = j; held[j] = 1; nHeld++;
    aim(j, px, py);
    if (!touched) { touched = true; elHint.hidden = true; }
    showE();
  });
  stage.addEventListener('pointermove', function (e) {
    var px = (e.clientX - ox) / sc, py = (e.clientY - oy) / sc;
    var j = ptrs[e.pointerId];
    if (j !== undefined) aim(j, px, py);
    if (e.pointerType !== 'touch') { hoverOn = true; hoverX = px; hoverY = py; }
  });
  function onUp(e) { release(e.pointerId); }
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', onUp);
  stage.addEventListener('lostpointercapture', onUp);
  stage.addEventListener('pointerleave', function (e) { if (ptrs[e.pointerId] === undefined) hoverOn = false; });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('blur', function () { hoverOn = false; });

  /* ---------- main loop ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    var el = (now - last) / 1000, j, s, cur;
    last = now;
    if (!(el > 0)) el = 0;
    if (el > 0.1) el = 0.1;
    if (!paused) {
      acc += el;
      while (acc >= DT) { step(); acc -= DT; }
      s = 0;
      for (j = 0; j < N; j++) s += th[j] + om[j];
      if (s !== s || s === Infinity || s === -Infinity) reset();
    }
    hoverIdx = (hoverOn && nHeld === 0) ? nearest(hoverX, hoverY) : -1;
    cur = nHeld > 0 ? 'grabbing' : (hoverIdx >= 0 ? 'grab' : 'default');
    if (cur !== curCursor) { curCursor = cur; stage.style.cursor = cur; }
    render(paused ? 1 : acc / DT);
    if (now - lastE >= 60) { lastE = now; showE(); }
  }

  /* read-only inspection hook for testing; the page does not depend on it */
  window.rippleRail = {
    N: N, dt: DT, theta: th, omega: om, energy: energy, steps: function () { return nSteps; },
    state: function () { return { level: level, g: g, ends: free ? 'Free' : 'Fixed', paused: paused }; }
  };

  setDamp(2); setEnds(false); setPaused(false);
  render(1);
  showE();
  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
