<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Rail</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#10191e;color:#e8eeed;font-family:system-ui,"Segoe UI",Arial,sans-serif}
#stage{display:block;width:100%;height:100%;touch-action:none;user-select:none}
text{font-family:system-ui,"Segoe UI",Arial,sans-serif}
.mono{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.control{cursor:pointer;outline:none}.control .plate{fill:#1c292f;stroke:#405058;stroke-width:1}
.control:hover .plate{fill:#2b3b42;stroke:#91a8af}.control:focus-visible .plate{stroke:#ffe1a2;stroke-width:3}
.control[aria-pressed="true"] .plate{fill:#ead3a5;stroke:#ead3a5}.control[aria-pressed="true"] text{fill:#172329}
.control text{fill:#eef2ee;pointer-events:none}.key{font-family:ui-monospace,Consolas,monospace;font-size:14px}
.label{font-size:11px;letter-spacing:2px;fill:#9aafb5}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Ripple Rail — a coupled pendulum instrument</title>
<desc id="art-desc">Twenty-five long pendulums hang from a dark metal rail. A fine gold ribbon connects their centres, revealing waves as they travel and reflect. Drag any bob to disturb the row. Blue indicates leftward motion and violet indicates rightward motion. Use the controls below or keys one, two, three, F, Space, and R to change damping, boundaries, playback, and reset.</desc>
<defs>
 <linearGradient id="rod" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="620"><stop stop-color="#425960"/><stop offset="1" stop-color="#a7bec2"/></linearGradient>
 <linearGradient id="rail" x2="0" y2="1"><stop stop-color="#53656a"/><stop offset=".45" stop-color="#2d4047"/><stop offset="1" stop-color="#1e2e35"/></linearGradient>
 <radialGradient id="sheen" cx=".3" cy=".2" r=".8"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#07151b" stop-opacity=".35"/></radialGradient>
 <pattern id="ticks" width="56" height="10" patternUnits="userSpaceOnUse" x="128"><path d="M0 0v5" stroke="#4a6068" stroke-width="1"/></pattern>
</defs>
<path fill="#10191e" d="M0 0h1600v900H0z"/>
<text x="48" y="48" fill="#eee8d9" font-size="24" font-weight="600" letter-spacing="5">RIPPLE RAIL</text>
<text x="325" y="47" class="label">A COUPLED PENDULUM INSTRUMENT</text>
<g transform="translate(1190 38)">
 <circle cx="0" cy="0" r="4" fill="#7bd2e6"/><text x="13" y="4" fill="#b4c5ca" font-size="11" letter-spacing="1">LEFT</text>
 <circle cx="95" cy="0" r="4" fill="#d4d9cf"/><text x="108" y="4" fill="#b4c5ca" font-size="11" letter-spacing="1">REST</text>
 <circle cx="196" cy="0" r="4" fill="#b59af4"/><text x="209" y="4" fill="#b4c5ca" font-size="11" letter-spacing="1">RIGHT</text>
 <text x="362" y="4" text-anchor="end" class="mono" fill="#9aafb5" font-size="11">ω</text>
</g>
<path d="M48 71H1552" stroke="#2a3b42"/>
<g stroke="#43565e" fill="#1b2a31"><path d="M88 100V87M1512 100V87" stroke-width="3"/><rect x="88" y="94" width="1424" height="12" rx="6" fill="url(#rail)"/><circle cx="101" cy="100" r="2" fill="#84989e"/><circle cx="1499" cy="100" r="2" fill="#84989e"/></g>
<path d="M128 620H1472" stroke="#30454c" stroke-dasharray="2 10"/>
<g id="rods"></g>
<path id="ribbon-halo" fill="none" stroke="#e9c88a" stroke-width="8" opacity=".06" stroke-linecap="round" stroke-linejoin="round"/>
<path id="ribbon" fill="none" stroke="#e9c88a" stroke-width="2" opacity=".85" stroke-linecap="round" stroke-linejoin="round"/>
<g id="pivots"></g><g id="bobs"></g>
<path d="M128 706H1472" stroke="#30434b"/><rect x="128" y="706" width="1345" height="10" fill="url(#ticks)"/>
<text x="128" y="738" class="label">01</text><text x="800" y="738" text-anchor="middle" class="label">13</text><text x="1472" y="738" text-anchor="end" class="label">25</text>
<text x="48" y="766" class="label">DISTURB ONE. WATCH THE REST.</text>
<text x="1552" y="766" text-anchor="end" class="mono" fill="#839ba4" font-size="11">25 OSCILLATORS / 520 LENGTH / 56 PITCH</text>
<rect x="48" y="784" width="1504" height="96" rx="12" fill="#152229" stroke="#35474e"/>
<text x="70" y="807" class="label">DAMPING</text><text id="damping-value" x="487" y="807" text-anchor="end" class="mono" fill="#becdce" font-size="12">g = 0.25</text>
<g class="control" id="damp1" role="button" tabindex="0" aria-label="Damping level 1, zero damping" aria-pressed="false" transform="translate(70 817)"><rect class="plate" width="128" height="36" rx="6"/><text x="14" y="23" class="key">1</text><text x="40" y="23" font-size="13">Undamped</text></g>
<g class="control" id="damp2" role="button" tabindex="0" aria-label="Damping level 2, gentle damping" aria-pressed="true" transform="translate(208 817)"><rect class="plate" width="128" height="36" rx="6"/><text x="14" y="23" class="key">2</text><text x="40" y="23" font-size="13">Gentle</text></g>
<g class="control" id="damp3" role="button" tabindex="0" aria-label="Damping level 3, heavy damping" aria-pressed="false" transform="translate(346 817)"><rect class="plate" width="141" height="36" rx="6"/><text x="14" y="23" class="key">3</text><text x="40" y="23" font-size="13">Heavy</text></g>
<path d="M511 801v62M1220 801v62" stroke="#35474e"/>
<text x="535" y="807" class="label">BOUNDARY</text>
<g class="control" id="ends" role="button" tabindex="0" aria-label="Toggle fixed or free ends" aria-pressed="false" transform="translate(535 817)"><rect class="plate" width="189" height="36" rx="6"/><text x="14" y="23" class="key">F</text><text id="ends-value" x="44" y="23" font-size="13">Fixed ends</text><path d="M165 13l4 5-4 5" fill="none" stroke="#a5b8bd"/></g>
<text x="751" y="807" class="label">TRANSPORT</text>
<g class="control" id="pause" role="button" tabindex="0" aria-label="Pause dynamics" aria-pressed="false" transform="translate(751 817)"><rect class="plate" width="242" height="36" rx="6"/><text x="14" y="23" class="key">SPACE</text><text id="pause-value" x="84" y="23" font-size="13">Pause</text><circle id="run-light" cx="222" cy="18" r="3" fill="#d8d6b6"/></g>
<g class="control" id="reset" role="button" tabindex="0" aria-label="Reset all pendulums" transform="translate(1007 817)"><rect class="plate" width="189" height="36" rx="6"/><text x="14" y="23" class="key">R</text><text x="44" y="23" font-size="13">Reset</text><path d="M166 13a6 6 0 1 1-6 0m0-3v5h5" fill="none" stroke="#b9c9cd"/></g>
<text x="1244" y="807" class="label">SYSTEM ENERGY</text><text id="energy" x="1244" y="843" fill="#e9d3a8" font-size="26" class="mono">E = 0.00</text>
<text id="hint" x="70" y="870" fill="#a6bbc2" font-size="11">Drag a bob to send a wave along the rail.</text><text x="1529" y="869" text-anchor="end" fill="#a6bbc2" font-size="10" class="mono">rad²/s²</text>
</svg>
<script>
'use strict';
const N=25,L=520,K=60,W2=4,DT=1/240,LIMIT=80*Math.PI/180;
const theta=new Float64Array(N),velocity=new Float64Array(N),x=new Float64Array(N),bx=new Float64Array(N),by=new Float64Array(N);
const stage=document.getElementById('stage'),ns='http://www.w3.org/2000/svg';
let damping=2,fixed=true,paused=false,held=-1,hover=-1,pointerId=null,heldAngle=0,touched=false,accumulator=0,lastTime=null,lastHUD=-1,lastPointer=null;
const rods=[],bobs=[],rings=[],shine=[],qTmp=new Float64Array(N),vTmp=new Float64Array(N);
const dq=Array.from({length:4},()=>new Float64Array(N)),dv=Array.from({length:4},()=>new Float64Array(N));
function svgNode(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [key,val]of Object.entries(attrs))e.setAttribute(key,val);parent.appendChild(e);return e;}
for(let i=0;i<N;i++){
 x[i]=800+56*(i-12);bx[i]=x[i];by[i]=620;
 rods.push(svgNode('line',{x1:x[i],y1:100,x2:x[i],y2:620,stroke:'url(#rod)','stroke-width':1.6},document.getElementById('rods')));
 const pivot=svgNode('g',{},document.getElementById('pivots'));
 svgNode('circle',{cx:x[i],cy:100,r:5,fill:'#10191e',stroke:'#839a9e','stroke-width':1.5},pivot);
 svgNode('circle',{cx:x[i],cy:100,r:1.6,fill:'#c1ccca'},pivot);
 const group=svgNode('g',{transform:`translate(${x[i]} 620)`},document.getElementById('bobs'));
 rings.push(svgNode('circle',{r:25,fill:'none',stroke:'#f1d29a','stroke-width':1.5,opacity:0},group));
 bobs.push(svgNode('circle',{r:18,fill:'#d4d9cf',stroke:'#10191e','stroke-width':2},group));
 svgNode('circle',{r:17,fill:'url(#sheen)','pointer-events':'none'},group);
 svgNode('path',{d:'M-10-8Q-6-13 1-13',fill:'none',stroke:'#fff','stroke-opacity':.45,'stroke-width':1.2,'stroke-linecap':'round'},group);
 shine.push(group);
}
function constrain(){if(held>=0){theta[held]=heldAngle;velocity[held]=0;}}
function derivative(q,v,outQ,outV){
 const g=[0,0,.25,1.2][damping];
 for(let i=0;i<N;i++){
  if(i===held){outQ[i]=0;outV[i]=0;continue;}
  const left=i===0?(fixed?0:q[0]):q[i-1],right=i===N-1?(fixed?0:q[N-1]):q[i+1];
  outQ[i]=v[i];outV[i]=-W2*Math.sin(q[i])+K*(right-2*q[i]+left)-g*v[i];
 }
}
function step(){
 constrain();derivative(theta,velocity,dq[0],dv[0]);
 for(let s=1;s<4;s++){
  const scale=s===3?DT:DT/2;
  for(let i=0;i<N;i++){qTmp[i]=theta[i]+scale*dq[s-1][i];vTmp[i]=velocity[i]+scale*dv[s-1][i];}
  derivative(qTmp,vTmp,dq[s],dv[s]);
 }
 for(let i=0;i<N;i++){
  theta[i]+=DT/6*(dq[0][i]+2*dq[1][i]+2*dq[2][i]+dq[3][i]);
  velocity[i]+=DT/6*(dv[0][i]+2*dv[1][i]+2*dv[2][i]+dv[3][i]);
 }
 constrain();
}
function energy(){let e=0;for(let i=0;i<N;i++){e+=.5*velocity[i]*velocity[i]+W2*(1-Math.cos(theta[i]));if(i<N-1)e+=.5*K*(theta[i+1]-theta[i])**2;}if(fixed)e+=.5*K*(theta[0]**2+theta[N-1]**2);return e;}
function stateColor(v){const a=Math.min(1,Math.abs(v)/2.5),to=v<0?[123,210,230]:[181,154,244],from=[212,217,207];return `rgb(${from.map((n,i)=>Math.round(n+(to[i]-n)*a)).join(',')})`;}
function render(){
 for(let i=0;i<N;i++){
  bx[i]=x[i]+L*Math.sin(theta[i]);by[i]=100+L*Math.cos(theta[i]);
  rods[i].setAttribute('x2',bx[i]);rods[i].setAttribute('y2',by[i]);
  rods[i].setAttribute('opacity',i===held?1:.75);
  shine[i].setAttribute('transform',`translate(${bx[i]} ${by[i]})`);
  bobs[i].setAttribute('fill',i===held?'#f1cf91':stateColor(velocity[i]));
 }
 if(held<0)hover=lastPointer?nearest(lastPointer):-1;
 for(let i=0;i<N;i++){rings[i].setAttribute('opacity',i===held?1:i===hover?.7:0);rings[i].setAttribute('r',i===held?28:25);}
 let d=`M${bx[0]} ${by[0]}`;
 for(let i=0;i<N-1;i++){
  const p=Math.max(0,i-1),n=Math.min(N-1,i+2);
  d+=` C${bx[i]+(bx[i+1]-bx[p])/6} ${by[i]+(by[i+1]-by[p])/6} ${bx[i+1]-(bx[n]-bx[i])/6} ${by[i+1]-(by[n]-by[i])/6} ${bx[i+1]} ${by[i+1]}`;
 }
 document.getElementById('ribbon').setAttribute('d',d);document.getElementById('ribbon-halo').setAttribute('d',d);
 stage.style.cursor=held>=0?'grabbing':hover>=0?'grab':'default';
}
function refreshHUD(){
 document.getElementById('damping-value').textContent=`g = ${[0,'0.00','0.25','1.20'][damping]}`;
 for(let i=1;i<=3;i++)document.getElementById('damp'+i).setAttribute('aria-pressed',String(damping===i));
 document.getElementById('ends-value').textContent=fixed?'Fixed ends':'Free ends';
 document.getElementById('ends').setAttribute('aria-pressed',String(!fixed));
 document.getElementById('pause-value').textContent=paused?'PAUSED · Resume':'Pause';
 document.getElementById('pause').setAttribute('aria-pressed',String(paused));
 document.getElementById('pause').setAttribute('aria-label',paused?'Resume dynamics':'Pause dynamics');
 document.getElementById('run-light').setAttribute('fill',paused?'#172329':'#d8d6b6');
 document.getElementById('energy').textContent=`E = ${energy().toFixed(2)}`;
 document.getElementById('hint').textContent=touched?'Blue moves left. Violet moves right. Gold is in your hands.':'Drag a bob to send a wave along the rail.';
}
function markTouched(){touched=true;}
function release(){if(held>=0)velocity[held]=0;held=-1;const id=pointerId;pointerId=null;if(id!==null&&stage.hasPointerCapture(id))stage.releasePointerCapture(id);render();refreshHUD();}
function action(key){
 markTouched();
 if(key==='1'||key==='2'||key==='3')damping=Number(key);
 else if(key==='f')fixed=!fixed;
 else if(key===' '){paused=!paused;accumulator=0;}
 else if(key==='r'){release();theta.fill(0);velocity.fill(0);accumulator=0;hover=-1;}
 refreshHUD();render();
}
for(const [id,key]of [['damp1','1'],['damp2','2'],['damp3','3'],['ends','f'],['pause',' '],['reset','r']]){
 const el=document.getElementById(id);el.addEventListener('click',()=>action(key));
 el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();action(key);}});
}
document.addEventListener('keydown',e=>{
 const key=e.key.toLowerCase();if(!['1','2','3','f',' ','r'].includes(key)||e.ctrlKey||e.metaKey||e.altKey)return;
 e.preventDefault();if(e.repeat)return;
 if(key===' '&&document.activeElement?.classList?.contains('control'))document.activeElement.dispatchEvent(new MouseEvent('click'));else action(key);
});
function position(e){const pt=stage.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(stage.getScreenCTM().inverse());}
function nearest(p){let best=-1,d=30*30;for(let i=0;i<N;i++){const dd=(p.x-bx[i])**2+(p.y-by[i])**2;if(dd<=d){d=dd;best=i;}}return best;}
function pose(p){heldAngle=Math.max(-LIMIT,Math.min(LIMIT,Math.atan2(p.x-x[held],p.y-100)));constrain();render();refreshHUD();}
stage.addEventListener('pointerdown',e=>{
 if(held>=0||e.button!==0||e.target.closest('.control'))return;
 const p=position(e),i=nearest(p);if(i<0)return;
 e.preventDefault();held=i;pointerId=e.pointerId;stage.setPointerCapture(pointerId);markTouched();pose(p);
});
stage.addEventListener('pointermove',e=>{const p=position(e);lastPointer=e.target.closest('.control')?null:p;if(held>=0){if(e.pointerId===pointerId)pose(p);}else{render();}});
stage.addEventListener('pointerup',e=>{if(e.pointerId===pointerId){pose(position(e));release();hover=nearest(position(e));render();}});
stage.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId)release();});
stage.addEventListener('lostpointercapture',e=>{if(e.pointerId===pointerId)release();});
stage.addEventListener('pointerleave',()=>{lastPointer=null;if(held<0){hover=-1;render();}});
function frame(time){
 const elapsed=lastTime===null?0:Math.min(.1,Math.max(0,(time-lastTime)/1000));lastTime=time;
 if(!paused){accumulator+=elapsed;while(accumulator+1e-12>=DT){step();accumulator-=DT;}}else accumulator=0;
 render();if(time-lastHUD>=80){refreshHUD();lastHUD=time;}requestAnimationFrame(frame);
}
render();refreshHUD();requestAnimationFrame(frame);
</script>
</body>
</html>
