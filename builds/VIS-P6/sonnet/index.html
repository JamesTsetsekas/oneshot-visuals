<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ripple Rail Pendulum Toy</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1220; }
  body { position: fixed; inset: 0; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  /* The frame is the letterboxed 16:9 area of the artboard; the HUD is laid out inside it. */
  #frame { position: fixed; inset: 0; margin: auto; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); container-type: size; pointer-events: none; }
  #hud { --u: 0.0625cqw; position: absolute; left: 0; right: 0; top: 86.6667%; height: 11.1111%; box-sizing: border-box; padding: 0 calc(88 * var(--u)); display: flex; flex-direction: column; justify-content: space-between; color: #dbe5f5; font: 400 calc(24 * var(--u)) / 1.25 system-ui, "Segoe UI", Arial, sans-serif; }
  .row { display: flex; align-items: center; gap: calc(30 * var(--u)); height: calc(44 * var(--u)); white-space: nowrap; }
  .row.btns { gap: calc(14 * var(--u)); }
  .sep { width: calc(2 * var(--u)); height: calc(26 * var(--u)); background: #2a3b5e; margin: 0 calc(8 * var(--u)); }
  #hud-hint { flex: 1; text-align: center; color: #ffd27a; font-weight: 600; letter-spacing: 0.02em; }
  #hud-paused { min-width: calc(130 * var(--u)); text-align: center; font-weight: 800; letter-spacing: 0.12em; color: #1a1204; border-radius: calc(8 * var(--u)); padding: calc(2 * var(--u)) 0; }
  #hud-paused.on { background: #ffd27a; }
  #hud-energy { min-width: calc(250 * var(--u)); text-align: right; font-size: calc(30 * var(--u)); font-weight: 700; font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, "Courier New", monospace; color: #f2f7ff; }
  #hud-damping b, #hud-ends b { color: #fff; font-weight: 700; }
  button { pointer-events: auto; display: inline-flex; align-items: center; gap: calc(10 * var(--u)); height: calc(40 * var(--u)); padding: 0 calc(16 * var(--u)) 0 calc(7 * var(--u)); border: calc(1.5 * var(--u)) solid #3a4d78; border-radius: calc(10 * var(--u)); background: #16213a; color: #e6eefb; font: 500 calc(20 * var(--u)) / 1 system-ui, "Segoe UI", Arial, sans-serif; cursor: pointer; white-space: nowrap; }
  button:hover { background: #1e2d4f; border-color: #5b76ad; }
  button .key { display: inline-grid; place-items: center; min-width: calc(26 * var(--u)); height: calc(26 * var(--u)); padding: 0 calc(7 * var(--u)); border-radius: calc(6 * var(--u)); background: #2b3d63; color: #fff; font: 700 calc(17 * var(--u)) / 1 ui-monospace, Consolas, "Courier New", monospace; }
  button[aria-pressed="true"] { background: #2f6fbf; border-color: #a9d0ff; color: #fff; }
  button[aria-pressed="true"] .key { background: #17365f; }
  button:focus-visible { outline: calc(3 * var(--u)) solid #ffd27a; outline-offset: calc(2 * var(--u)); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="stg-title stg-desc">
  <title id="stg-title">Ripple Rail</title>
  <desc id="stg-desc">A horizontal rail holds twenty-five pendulums side by side, each coupled to its neighbours. A smooth glowing ribbon runs through every bob so that a disturbance travelling along the row, reflecting from the ends and slowly fading, is visible as one continuous wave. Bobs tint blue or orange by swing direction and speed. Drag any bob and let go.</desc>
  <defs>
    <radialGradient id="bgGlow" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(800 400) scale(780 400)">
      <stop offset="0" stop-color="#22345a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#162341" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="railG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9bbd9"/>
      <stop offset="0.45" stop-color="#5b6e94"/>
      <stop offset="1" stop-color="#27334f"/>
    </linearGradient>
    <radialGradient id="pivotG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9db0d2"/>
      <stop offset="1" stop-color="#3b4b6d"/>
    </radialGradient>
    <radialGradient id="bobShade" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000814" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4d78" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4a6296" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a4d78" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3b66" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a3b66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="legendG" x1="0" y1="0" x2="1" y2="0"></linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#33425f"/>
      <rect width="2.4" height="6" fill="#8fa3c7"/>
    </pattern>
  </defs>

  <rect id="bg" x="0" y="0" width="1600" height="900" fill="#0b1220"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- floor / rest guides -->
  <rect x="88" y="690" width="1424" height="70" fill="url(#floorFade)"/>
  <rect x="88" y="689" width="1424" height="2" fill="url(#floorG)"/>
  <g id="restTicks"></g>
  <g id="shadows"></g>

  <!-- rail and end clamps -->
  <rect x="88" y="93" width="1424" height="14" rx="7" fill="url(#railG)"/>
  <rect x="88" y="94.5" width="1424" height="2" rx="1" fill="#ffffff" opacity="0.35"/>
  <g id="endFixed">
    <rect x="68" y="78" width="20" height="44" rx="4" fill="url(#hatch)" stroke="#a9bbd9" stroke-width="2"/>
    <rect x="1512" y="78" width="20" height="44" rx="4" fill="url(#hatch)" stroke="#a9bbd9" stroke-width="2"/>
  </g>
  <g id="endFree" display="none">
    <rect x="68" y="78" width="20" height="44" rx="4" fill="none" stroke="#6f84ab" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="1512" y="78" width="20" height="44" rx="4" fill="none" stroke="#6f84ab" stroke-width="2" stroke-dasharray="5 4"/>
  </g>

  <g id="rods"></g>
  <g id="ribbon">
    <path id="ribbonGlowWide" fill="none" stroke="#8fc3ff" stroke-width="22" stroke-opacity="0.07" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="ribbonGlow" fill="none" stroke="#b9dcff" stroke-width="10" stroke-opacity="0.16" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="ribbonSegs"></g>
  </g>
  <g id="bobs"></g>
  <g id="pivots"></g>
  <g id="rings">
    <circle id="hintRing" r="30" fill="none" stroke="#ffd27a" stroke-width="2.5" display="none"/>
    <circle id="hoverRing" r="27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95" display="none"/>
    <g id="heldRing" display="none">
      <circle r="35" fill="none" stroke="#ffd27a" stroke-width="2" stroke-opacity="0.45"/>
      <circle r="27" fill="none" stroke="#ffd27a" stroke-width="4.5"/>
    </g>
  </g>

  <!-- velocity legend -->
  <g id="legend" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#b9c8e2">
    <text x="88" y="722">Angular velocity: blue swings toward &#8722;x, orange toward +x</text>
    <rect x="88" y="731" width="300" height="11" rx="5.5" fill="url(#legendG)" stroke="#3a4d78" stroke-width="1"/>
    <text x="88" y="766">&#8722;4</text>
    <text x="238" y="766" text-anchor="middle">0</text>
    <text x="388" y="766" text-anchor="end">+4 rad/s</text>
  </g>
</svg>

<div id="frame">
  <div id="hud" aria-label="Controls and readouts">
    <div class="row">
      <span id="hud-damping">Damping <b>2</b> &middot; g = 0.25</span>
      <span id="hud-ends">Ends: <b>Fixed</b></span>
      <span id="hud-hint">Drag a bob</span>
      <span id="hud-paused"></span>
      <span id="hud-energy">E = 0.00</span>
    </div>
    <div class="row btns">
      <button type="button" id="btn-d1" data-damp="0" aria-pressed="false" aria-label="Damping level 1, g 0.0"><span class="key">1</span><span>g 0.0</span></button>
      <button type="button" id="btn-d2" data-damp="1" aria-pressed="true" aria-label="Damping level 2, g 0.25"><span class="key">2</span><span>g 0.25</span></button>
      <button type="button" id="btn-d3" data-damp="2" aria-pressed="false" aria-label="Damping level 3, g 1.2"><span class="key">3</span><span>g 1.2</span></button>
      <span class="sep"></span>
      <button type="button" id="btn-ends" aria-pressed="false" aria-label="Toggle ends between fixed and free"><span class="key">F</span><span>Free ends</span></button>
      <button type="button" id="btn-pause" aria-pressed="false" aria-label="Pause or resume"><span class="key">Space</span><span id="pauseLbl">Pause</span></button>
      <button type="button" id="btn-reset" aria-label="Reset all pendulums to rest"><span class="key">R</span><span>Reset</span></button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var N = 25, W2 = 4.0, K = 60.0, L = 520, PY = 100, BOB_R = 18, GRAB_R = 30;
  var DT = 1 / 480;                       // fixed physics step (<= 1/240)
  var GAMMA = [0.0, 0.25, 1.2];
  var GTXT = ['0.0', '0.25', '1.2'];
  var MAXANG = 80 * Math.PI / 180;
  var NS = 'http://www.w3.org/2000/svg';

  var th = new Float64Array(N), om = new Float64Array(N), ac = new Float64Array(N);
  var px = new Float64Array(N);
  for (var i = 0; i < N; i++) px[i] = 800 + 56 * (i - 12);

  var level = 1, fixedEnds = true, paused = false;
  var held = -1, heldPointer = null, heldTarget = 0;
  var touched = false;
  var ptr = { x: 0, y: 0, valid: false, type: 'mouse' };
  var accum = 0, last = null;

  /* ---------------- physics ---------------- */
  function accel() {
    for (var i = 0; i < N; i++) {
      var l = i > 0 ? th[i - 1] : (fixedEnds ? 0 : th[0]);
      var r = i < N - 1 ? th[i + 1] : (fixedEnds ? 0 : th[N - 1]);
      ac[i] = -W2 * Math.sin(th[i]) + K * (r - 2 * th[i] + l);
    }
  }
  function pin() { if (held >= 0) { th[held] = heldTarget; om[held] = 0; } }
  // Strang splitting: half damping, half kick, drift, half kick, half damping (symplectic when g = 0).
  function step() {
    var d = Math.exp(-GAMMA[level] * DT / 2), h = 0.5 * DT, i;
    pin(); accel();
    for (i = 0; i < N; i++) om[i] = om[i] * d + h * ac[i];
    for (i = 0; i < N; i++) th[i] += DT * om[i];
    pin(); accel();
    for (i = 0; i < N; i++) om[i] = d * (om[i] + h * ac[i]);
    pin();
  }
  function energy() {
    var E = 0, i, dd;
    for (i = 0; i < N; i++) E += 0.5 * om[i] * om[i] + W2 * (1 - Math.cos(th[i]));
    for (i = 0; i < N - 1; i++) { dd = th[i + 1] - th[i]; E += 0.5 * K * dd * dd; }
    if (fixedEnds) E += 0.5 * K * (th[0] * th[0] + th[N - 1] * th[N - 1]);
    return E;
  }

  /* ---------------- scene construction ---------------- */
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var svg = document.getElementById('stage');
  var defs = svg.querySelector('defs');
  var gRods = document.getElementById('rods'), gBobs = document.getElementById('bobs'),
      gPivots = document.getElementById('pivots'), gShadows = document.getElementById('shadows'),
      gTicks = document.getElementById('restTicks'), gSegs = document.getElementById('ribbonSegs');
  var ribbonGlow = document.getElementById('ribbonGlow'), ribbonGlowWide = document.getElementById('ribbonGlowWide');
  var hoverRing = document.getElementById('hoverRing'), heldRing = document.getElementById('heldRing'), hintRing = document.getElementById('hintRing');

  var NB = [206, 216, 234], NR = [200, 222, 248], POS = [255, 150, 36], NEG = [44, 152, 255];
  function sat(w) { return 1 - Math.exp(-Math.abs(w) / 1.5); }
  function tint(n, w) {
    var s = sat(w), t = w >= 0 ? POS : NEG;
    return 'rgb(' + Math.round(n[0] + (t[0] - n[0]) * s) + ',' + Math.round(n[1] + (t[1] - n[1]) * s) + ',' + Math.round(n[2] + (t[2] - n[2]) * s) + ')';
  }

  // legend gradient uses the same mapping as the bobs
  var lg = document.getElementById('legendG');
  for (var q = 0; q <= 16; q++) {
    var wv = -4 + q * 0.5;
    el('stop', { offset: (q / 16).toFixed(4), 'stop-color': tint(NB, wv) }, lg);
  }

  var rods = [], bobs = [], glowStops = [], shadows = [], segs = [], segGrads = [], segStops = [];
  for (i = 0; i < N; i++) {
    el('circle', { cx: px[i], cy: 620, r: 2.5, fill: '#3a4d78' }, gTicks);
    shadows.push(el('ellipse', { cx: px[i], cy: 690, rx: 16, ry: 3.6, fill: '#000', 'fill-opacity': 0.38 }, gShadows));
    el('line', { x1: px[i], y1: PY, x2: px[i], y2: 620, stroke: '#0b1220', 'stroke-width': 6.5, 'stroke-opacity': 0.55, 'stroke-linecap': 'round' }, gRods);
    rods.push([gRods.lastChild, el('line', { x1: px[i], y1: PY, x2: px[i], y2: 620, stroke: '#9fb2d3', 'stroke-width': 2.6, 'stroke-linecap': 'round' }, gRods)]);
    // glow gradient per bob
    var rg = el('radialGradient', { id: 'gl' + i }, defs);
    var s0 = el('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': 0 }, rg);
    var s1 = el('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 0 }, rg);
    glowStops.push([s0, s1]);
    var g = el('g', { transform: 'translate(' + px[i] + ' 620)' }, gBobs);
    el('circle', { r: 40, fill: 'url(#gl' + i + ')' }, g);
    var body = el('circle', { r: BOB_R, fill: tint(NB, 0), stroke: '#0b1220', 'stroke-width': 1.5 }, g);
    el('circle', { r: BOB_R, fill: 'url(#bobShade)' }, g);
    el('circle', { r: BOB_R - 0.75, fill: 'none', stroke: '#ffffff', 'stroke-opacity': 0.22, 'stroke-width': 1.2 }, g);
    bobs.push([g, body]);
    // pivot
    el('circle', { cx: px[i], cy: PY, r: 8.5, fill: 'url(#pivotG)', stroke: '#0b1220', 'stroke-width': 1.5 }, gPivots);
    el('circle', { cx: px[i], cy: PY, r: 2.6, fill: '#0b1220' }, gPivots);
  }
  for (i = 0; i < N - 1; i++) {
    var lgd = el('linearGradient', { id: 'sg' + i, gradientUnits: 'userSpaceOnUse', x1: px[i], y1: 620, x2: px[i + 1], y2: 620 }, defs);
    var a0 = el('stop', { offset: 0, 'stop-color': '#c8def8' }, lgd), a1 = el('stop', { offset: 1, 'stop-color': '#c8def8' }, lgd);
    segGrads.push(lgd); segStops.push([a0, a1]);
    segs.push(el('path', { d: '', fill: 'none', stroke: 'url(#sg' + i + ')', 'stroke-width': 4.5, 'stroke-linecap': 'round' }, gSegs));
  }

  /* ---------------- HUD ---------------- */
  var hDamp = document.getElementById('hud-damping'), hEnds = document.getElementById('hud-ends'),
      hE = document.getElementById('hud-energy'), hPaused = document.getElementById('hud-paused'),
      hHint = document.getElementById('hud-hint');
  var dBtns = [document.getElementById('btn-d1'), document.getElementById('btn-d2'), document.getElementById('btn-d3')];
  var bEnds = document.getElementById('btn-ends'), bPause = document.getElementById('btn-pause'),
      bReset = document.getElementById('btn-reset'), pauseLbl = document.getElementById('pauseLbl');
  var endFixed = document.getElementById('endFixed'), endFree = document.getElementById('endFree');

  function updateHud() {
    hDamp.innerHTML = 'Damping <b>' + (level + 1) + '</b> &middot; g = ' + GTXT[level];
    hEnds.innerHTML = 'Ends: <b>' + (fixedEnds ? 'Fixed' : 'Free') + '</b>';
    for (var i = 0; i < 3; i++) dBtns[i].setAttribute('aria-pressed', i === level ? 'true' : 'false');
    bEnds.setAttribute('aria-pressed', fixedEnds ? 'false' : 'true');
    bEnds.lastChild.textContent = fixedEnds ? 'Free ends' : 'Fixed ends';
    bPause.setAttribute('aria-pressed', paused ? 'true' : 'false');
    pauseLbl.textContent = paused ? 'Resume' : 'Pause';
    hPaused.textContent = paused ? 'PAUSED' : '';
    hPaused.className = paused ? 'on' : '';
    hHint.textContent = touched ? '' : 'Drag a bob';
    endFixed.setAttribute('display', fixedEnds ? 'inline' : 'none');
    endFree.setAttribute('display', fixedEnds ? 'none' : 'inline');
  }
  var eText = '';
  function updateEnergy() {
    var t = 'E = ' + energy().toFixed(2);
    if (t !== eText) { eText = t; hE.textContent = t; }
  }

  /* ---------------- actions ---------------- */
  function setLevel(l) { level = l; updateHud(); }
  function toggleEnds() { fixedEnds = !fixedEnds; updateHud(); updateEnergy(); }
  function togglePause() { paused = !paused; accum = 0; updateHud(); }
  function releaseHold() {
    if (held >= 0) { om[held] = 0; }
    if (heldPointer !== null) { try { svg.releasePointerCapture(heldPointer); } catch (e) {} }
    held = -1; heldPointer = null;
  }
  function resetAll() {
    releaseHold();
    for (var i = 0; i < N; i++) { th[i] = 0; om[i] = 0; }
    accum = 0; updateEnergy();
  }
  dBtns.forEach(function (b) { b.addEventListener('click', function () { setLevel(+b.getAttribute('data-damp')); }); });
  bEnds.addEventListener('click', toggleEnds);
  bPause.addEventListener('click', togglePause);
  bReset.addEventListener('click', resetAll);
  [].forEach.call(document.querySelectorAll('button'), function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep focus ring keyboard-only
  });

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === ' ' || e.code === 'Space' || e.key === 'Spacebar') {
      e.preventDefault(); if (!e.repeat) togglePause(); return;
    }
    if (e.repeat) return;
    switch (e.key) {
      case '1': setLevel(0); break;
      case '2': setLevel(1); break;
      case '3': setLevel(2); break;
      case 'f': case 'F': toggleEnds(); break;
      case 'r': case 'R': resetAll(); break;
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.code === 'Space' || e.key === 'Spacebar') e.preventDefault();   // stop focused button re-clicking
  });

  /* ---------------- pointer ---------------- */
  var cursor = '';
  function toStage(e) {
    var m = svg.getScreenCTM();
    if (!m) return null;
    var p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  function nearest(x, y) {
    var best = -1, bd = GRAB_R * GRAB_R;
    for (var i = 0; i < N; i++) {
      var bx = px[i] + L * Math.sin(th[i]), by = PY + L * Math.cos(th[i]);
      var d = (bx - x) * (bx - x) + (by - y) * (by - y);
      if (d <= bd) { bd = d; best = i; }
    }
    return best;
  }
  function targetAngle(i, x, y) {
    var a = Math.atan2(x - px[i], y - PY);
    return a > MAXANG ? MAXANG : (a < -MAXANG ? -MAXANG : a);
  }
  svg.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var p = toStage(e); if (!p) return;
    ptr.x = p.x; ptr.y = p.y; ptr.valid = true; ptr.type = e.pointerType;
    if (held >= 0) return;
    var i = nearest(p.x, p.y);
    if (i < 0) return;
    e.preventDefault();
    held = i; heldPointer = e.pointerId;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    heldTarget = targetAngle(i, p.x, p.y);
    th[i] = heldTarget; om[i] = 0;
    if (!touched) { touched = true; updateHud(); }
    updateEnergy();
  });
  svg.addEventListener('pointermove', function (e) {
    var p = toStage(e); if (!p) return;
    ptr.x = p.x; ptr.y = p.y; ptr.valid = true; ptr.type = e.pointerType;
    if (held >= 0 && e.pointerId === heldPointer && e.pointerType === 'mouse' && e.buttons === 0) { releaseHold(); updateEnergy(); return; }
    if (held >= 0 && e.pointerId === heldPointer) {
      heldTarget = targetAngle(held, p.x, p.y);
      th[held] = heldTarget; om[held] = 0;
    }
  });
  function up(e) {
    if (held >= 0 && e.pointerId === heldPointer) { releaseHold(); updateEnergy(); }
    if (e.pointerType !== 'mouse') ptr.valid = false;
  }
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('pointerleave', function (e) { if (held < 0) ptr.valid = false; });
  svg.addEventListener('contextmenu', function (e) { if (held >= 0) e.preventDefault(); });

  /* ---------------- render ---------------- */
  var bx = new Float64Array(N), by = new Float64Array(N);
  function f1(v) { return v.toFixed(2); }
  function render(now) {
    var i;
    for (i = 0; i < N; i++) {
      bx[i] = px[i] + L * Math.sin(th[i]);
      by[i] = PY + L * Math.cos(th[i]);
      var b = bobs[i], w = om[i];
      b[0].setAttribute('transform', 'translate(' + f1(bx[i]) + ' ' + f1(by[i]) + ')');
      b[1].setAttribute('fill', tint(NB, w));
      rods[i][0].setAttribute('x2', f1(bx[i])); rods[i][0].setAttribute('y2', f1(by[i]));
      rods[i][1].setAttribute('x2', f1(bx[i])); rods[i][1].setAttribute('y2', f1(by[i]));
      var s = sat(w), gc = tint(w >= 0 ? POS : NEG, 0);
      glowStops[i][0].setAttribute('stop-color', gc); glowStops[i][1].setAttribute('stop-color', gc);
      glowStops[i][0].setAttribute('stop-opacity', (0.75 * s).toFixed(2));
      shadows[i].setAttribute('cx', f1(bx[i]));
      shadows[i].setAttribute('rx', (16 + 3 * Math.abs(Math.sin(th[i]))).toFixed(1));
    }
    // ribbon: Catmull-Rom through bob centres, as cubic Beziers
    var full = 'M' + f1(bx[0]) + ' ' + f1(by[0]);
    for (i = 0; i < N - 1; i++) {
      var i0 = i > 0 ? i - 1 : 0, i3 = i < N - 2 ? i + 2 : N - 1;
      var c1x = bx[i] + (bx[i + 1] - bx[i0]) / 6, c1y = by[i] + (by[i + 1] - by[i0]) / 6;
      var c2x = bx[i + 1] - (bx[i3] - bx[i]) / 6, c2y = by[i + 1] - (by[i3] - by[i]) / 6;
      var seg = 'C' + f1(c1x) + ' ' + f1(c1y) + ' ' + f1(c2x) + ' ' + f1(c2y) + ' ' + f1(bx[i + 1]) + ' ' + f1(by[i + 1]);
      full += seg;
      segs[i].setAttribute('d', 'M' + f1(bx[i]) + ' ' + f1(by[i]) + seg);
      var gr = segGrads[i];
      gr.setAttribute('x1', f1(bx[i])); gr.setAttribute('y1', f1(by[i]));
      gr.setAttribute('x2', f1(bx[i + 1])); gr.setAttribute('y2', f1(by[i + 1]));
      segStops[i][0].setAttribute('stop-color', tint(NR, om[i]));
      segStops[i][1].setAttribute('stop-color', tint(NR, om[i + 1]));
    }
    ribbonGlow.setAttribute('d', full); ribbonGlowWide.setAttribute('d', full);

    // hover / held / hint rings
    var hov = -1;
    if (held < 0 && ptr.valid && ptr.type !== 'touch') hov = nearest(ptr.x, ptr.y);
    if (held >= 0) {
      heldRing.setAttribute('transform', 'translate(' + f1(bx[held]) + ' ' + f1(by[held]) + ')');
      heldRing.setAttribute('display', 'inline');
    } else heldRing.setAttribute('display', 'none');
    if (hov >= 0) {
      hoverRing.setAttribute('cx', f1(bx[hov])); hoverRing.setAttribute('cy', f1(by[hov]));
      hoverRing.setAttribute('display', 'inline');
    } else hoverRing.setAttribute('display', 'none');
    if (!touched && hov < 0) {
      var ph = 0.5 + 0.5 * Math.sin(now / 1000 * 4);
      hintRing.setAttribute('cx', f1(bx[12])); hintRing.setAttribute('cy', f1(by[12]));
      hintRing.setAttribute('r', (28 + 5 * ph).toFixed(1));
      hintRing.setAttribute('stroke-opacity', (0.35 + 0.5 * (1 - ph)).toFixed(2));
      hintRing.setAttribute('display', 'inline');
    } else hintRing.setAttribute('display', 'none');
    var cur = held >= 0 ? 'grabbing' : (hov >= 0 ? 'grab' : 'default');
    if (cur !== cursor) { cursor = cur; svg.style.cursor = cur; }
  }

  /* ---------------- main loop ---------------- */
  var lastE = -1e9;
  function frame(now) {
    if (last === null) last = now;
    var dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
    if (!paused) {
      accum += dt;
      while (accum >= DT) { step(); accum -= DT; }
    }
    render(now);
    if (now - lastE >= 60) { lastE = now; updateEnergy(); }
    requestAnimationFrame(frame);
  }
  updateHud(); updateEnergy(); render(0);
  requestAnimationFrame(frame);

  // read-only inspection hook (theta/omega arrays are live)
  window.rippleRail = { theta: th, omega: om, energy: energy,
    get state() { return { level: level + 1, g: GAMMA[level], fixed: fixedEnds, paused: paused, held: held }; } };
})();
</script>
