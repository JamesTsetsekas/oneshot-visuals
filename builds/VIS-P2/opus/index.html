<title id="t">Sheet KHP-100: Kestrel Hand Pump</title>
<desc id="d">Engineering drawing sheet KHP-100 of the Kestrel hand pump, an original single-acting lever-operated force pump. An exploded front elevation at 1:4 separates all twelve numbered parts along chain explosion lines; a full centre section A-A shows the piston at the bottom of its 100 mm stroke with the top position in phantom, the inlet ball lifted and blue solid IN arrows on the upstroke; Detail B at 1:2 shows the valves on the downstroke with the inlet ball seated, the outlet ball pushed off its seat against a compressed spring and orange dashed OUT arrows. A key plan of the base plate marks cutting plane A-A, and a parts list, flow legend, notes and title block complete the sheet.</desc>
