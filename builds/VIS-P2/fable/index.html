<title id="sheetTitle">Sheet KHP-100: Kestrel Hand Pump</title>
<desc id="sheetDesc">Engineering drawing sheet KHP-100 of the Kestrel hand-operated force pump on A3 landscape. An exploded front elevation shows twelve numbered parts with balloons: lever handle, fulcrum bracket, link rod, piston rod, gland nut, cylinder barrel with valve block, piston with cup seal, inlet and outlet check valves, inlet strainer, outlet hose barb and base plate. Section A-A shows the assembled pump on the upstroke with blue solid arrows marking liquid drawn in past the lifted inlet ball. Detail B shows both valves on the downstroke with orange dashed arrows marking liquid leaving past the spring-loaded outlet ball. A key plan, flow legend, notes, parts list and title block complete the sheet.</desc>
