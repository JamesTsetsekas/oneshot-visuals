<title id="t">Sheet KHP-100: Kestrel Hand Pump</title>
<desc id="d">Engineering drawing sheet KHP-100 of the Kestrel hand pump, a single-acting force pump with a vertical cylinder on a base plate. The left view is an exploded front elevation of all twelve parts with numbered balloons, the centre view is section A-A showing the upstroke with the inlet ball lifted, and Detail B shows the downstroke valves with the outlet ball pushed off its seat against its spring. Blue solid arrows mark intake and orange dashed arrows mark discharge.</desc>
