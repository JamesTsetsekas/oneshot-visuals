<!doctype html>

<title id="title">The Last Ferry</title><desc id="description">A cream and rust ferry arrives in a quiet blue harbour beneath a sweeping lighthouse beam. Its ramp lowers, a quay lantern warms the stone, and a lone traveller carrying a case walks ashore, glances back, and continues into the evening as the ferry leaves.</desc>

<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',TAU=Math.PI*2;
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mod=(x,n)=>(x%n+n)%n;
function node(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function attr(id,k,v){$(id).setAttribute(k,v)}
let seed=71329;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
const stars=Array.from({length:64},()=>{let x=25+rand()*1550,y=28+rand()*315,r=.6+rand()*1.1;return{e:node('circle',{cx:x,cy:y,r},$('stars')),p:[3,4,6][Math.floor(rand()*3)],phase:rand()*TAU}});
const distant=Array.from({length:45},(_,i)=>({e:node('path',{},$('distantRipples')),x:rand()*1600,y:435+rand()*176,w:14+rand()*85,phase:rand()*TAU}));
const ripples=Array.from({length:95},()=>({e:node('path',{},$('waterLines')),x:rand()*1000,y:645+rand()*245,w:9+rand()*76,phase:rand()*TAU}));
const reflections=Array.from({length:28},(_,i)=>({e:node('rect',{height:1.5+rand()*2,rx:2},$('lightReflection')),x:915+rand()*90,y:647+i*8,w:15+rand()*80,phase:rand()*TAU}));
const foam=Array.from({length:18},(_,i)=>node('path',{'stroke-width':i<6?2.6:1.4},$('wake')));
const steam=Array.from({length:9},(_,i)=>node('ellipse',{rx:12+i*3,ry:9+i*2},$('steam')));
function ferryX(t){if(t<.5||t>=11.5)return -400;if(t<=4)return -400+1140*(1-Math.pow(1-(t-.5)/3.5,3));if(t<8.5)return 740;return 740-1140*Math.pow((t-8.5)/3,3)}
function foot(t,offset){const p=mod(t/.8+offset,1);if(p<.5)return{x:48-192*p,y:606};const q=(p-.5)*2;return{x:-48+96*smooth(q),y:606-28*Math.sin(Math.PI*q)}}
function leg(id,f,hip){const dx=f.x,dy=f.y-hip,d=Math.hypot(dx,dy),bend=Math.sqrt(Math.max(0,44*44-d*d/4));const kx=dx/2+dy/d*bend,ky=hip+dy/2-dx/d*bend;attr(id,'d',`M0 ${hip}Q${kx} ${ky} ${f.x} ${f.y}`)}
function render(raw){const t=mod(raw,12),wave=TAU*t/4,x=ferryX(t),moving=t>=.5&&t<4||t>=8.5&&t<11.5;const v=t<4?977.142857*Math.pow(1-(t-.5)/3.5,2):t>=8.5?380*Math.pow((t-8.5)/3,2):0;const speed=moving?clamp(v/650):0;
 const glow=t<5?0:t<5.6?smooth((t-5)/.6):t<9?1:1-smooth((t-9)/.6);
 const bob=2.2*Math.sin(wave)*(t>=4.2&&t<=8.2?0:1-smooth((t-4)/.2));
 // During contact the hinge is pinned to the quay; elsewhere the hull follows the swell.
 const freeBob=t>8.2?2.2*Math.sin(wave)*smooth((t-8.2)/.3):bob;
 attr('ferry','visibility',t>=.5&&t<11.5?'visible':'hidden');attr('ferry','transform',`translate(${x} 0)`);attr('boatBob','transform',`translate(0 ${freeBob})`);
 let angle=65;if(t>=4.2&&t<5)angle=65*(1-smooth((t-4.2)/.8));else if(t>=5&&t<7.4)angle=0;else if(t>=7.4&&t<8.2)angle=65*smooth((t-7.4)/.8);
 attr('ramp','transform',`translate(260 610) rotate(${-angle})`);attr('rampWarm','opacity',glow*.65);
 for(const id of ['groundGlow','lanternGlow'])attr(id,'opacity',glow);attr('lampGlass','fill',glow>0?'#d6b775':'#5b6971');
 const cos=Math.cos(TAU*t/12),flare=Math.pow(Math.max(0,Math.sin(TAU*t/12)),20);
 attr('beam','transform',`translate(260 330) scale(${cos} 1)`);attr('beam','opacity',.35+.65*Math.abs(cos));attr('flare','opacity',.06+.94*flare);
 stars.forEach(a=>a.e.setAttribute('opacity',.28+.62*(.5+.5*Math.sin(TAU*t/a.p+a.phase))));
 distant.forEach(a=>{const dx=4*Math.sin(wave+a.phase);a.e.setAttribute('d',`M${a.x+dx} ${a.y}h${a.w}`);a.e.setAttribute('opacity',.2+.65*(.5+.5*Math.sin(wave+a.phase)))});
 ripples.forEach(a=>{const dx=7*Math.sin(wave+a.phase),s=.5+.5*Math.sin(wave+a.phase);a.e.setAttribute('d',`M${a.x+dx} ${a.y}q${a.w*.4} ${-2*s} ${a.w} 0`);a.e.setAttribute('stroke',a.x<380&&flare>.1?'#c7bb99':'#75919d');a.e.setAttribute('opacity',.06+.16*s+flare*(a.x<380?.16:0))});
 reflections.forEach(a=>{a.e.setAttribute('x',a.x+Math.sin(wave+a.phase)*10);a.e.setAttribute('y',a.y);a.e.setAttribute('width',a.w*(.65+.35*Math.sin(wave+a.phase)));a.e.setAttribute('opacity',glow*.4*(1-(a.y-640)/300))});
 attr('wake','opacity',speed*.75);foam.forEach((e,i)=>{const side=t<8.5?1:-1,px=x+side*(i<6?240:-220-i*8),py=644+(i%6)*5;const jitter=Math.sin(wave+i)*4;e.setAttribute('d',`M${px} ${py}q${-side*(20+i*4)} ${-7-jitter} ${-side*(38+i*8)} ${i%3*3}`)});
 steam.forEach((e,i)=>{const age=(t-3.8)-i*.035,p=clamp(age/.88),fade=age>=0&&age<.88?Math.sin(Math.PI*p)*.33:0;e.setAttribute('cx',x-20-65*p+Math.sin(i*2)*18*p);e.setAttribute('cy',388-154*p-i*2);e.setAttribute('transform',`translate(${(x-20)*(1-(1+p))} ${(388-154*p-i*2)*(1-(1+p*.7))}) scale(${1+p} ${1+p*.7})`);e.setAttribute('opacity',t<5?fade:0)});
 const walk=t-5,px=640+240*walk;attr('passengerClip','visibility',t>=5&&t<9.5?'visible':'hidden');attr('passenger','transform',`translate(${px} 0)`);
 attr('doorReveal','width',56*smooth(walk/.24));if(walk>.35)attr('doorReveal','width',56);
 const a=foot(walk,0),b=foot(walk,.5),hip=535-2*Math.cos(TAU*walk/.4);leg('legBack',b,hip);leg('legFront',a,hip);
 for(const [id,f] of [['footBack',b],['footFront',a]])attr(id,'d',`M${f.x-5} ${f.y}l14 0`);
 const swing=Math.sin(TAU*walk/.8),handX=13-13*swing,handY=539+3*Math.cos(TAU*walk/.8);
 attr('armBack','d',`M-11 487Q${-9+15*swing} 511 ${-9+24*swing} 533`);attr('armFront','d',`M10 489Q${17-8*swing} 516 ${handX} ${handY}`);attr('case','transform',`translate(${handX} ${handY+21}) rotate(${-swing*4})`);attr('hand','cx',handX);attr('hand','cy',handY);
 const turn=t<7.3?0:t<7.7?smooth((t-7.3)/.4):t<8.1?1-smooth((t-7.7)/.4):0;attr('head','transform',`translate(0 ${hip-535}) scale(${1-2*turn} 1)`);
 const intensity=glow*clamp(1-Math.abs(px-1180)/280),right=px<1180;const stops=$('figureLight').children;stops[0].setAttribute('stop-color',right?'#142c3a':`rgb(${Math.round(34+150*intensity)},${Math.round(56+90*intensity)},${Math.round(67+26*intensity)})`);stops[2].setAttribute('stop-color',right?`rgb(${Math.round(48+180*intensity)},${Math.round(72+100*intensity)},${Math.round(80+30*intensity)})`:'#182e3b');
}
const param=new URLSearchParams(location.search).get('t');if(param!==null&&Number.isFinite(Number(param))){render(Number(param))}else{const start=performance.now();function tick(now){render((now-start)/1000);requestAnimationFrame(tick)}render(0);requestAnimationFrame(tick)}
</script></body></html>
