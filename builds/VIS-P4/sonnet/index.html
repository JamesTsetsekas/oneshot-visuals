<script>
(function(){
"use strict";
var NS="http://www.w3.org/2000/svg",TAU=Math.PI*2,D=12;
function $(id){return document.getElementById(id);}
function el(tag,at,par){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;}
function sm(u){u=u<0?0:u>1?1:u;return u*u*(3-2*u);}
function cl(v,a,b){return v<a?a:v>b?b:v;}
function fr(x){return x-Math.floor(x);}
function hash(k){var x=Math.sin(k*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mixc(a,b,k){return"rgb("+a.map(function(v,i){return Math.round(v+(b[i]-v)*k);}).join(",")+")";}
function f1(v){return v.toFixed(1);}

/* ---------- timeline functions ---------- */
function xf(t){
  if(t<0.5)return -400;
  if(t<4.0){var u=(t-0.5)/3.5;return -400+1140*(1-Math.pow(1-u,3));}
  if(t<8.5)return 740;
  if(t<11.5){var w=(t-8.5)/3;return 740-1140*w*w*w;}
  return -400;
}
function vxf(t){
  if(t>=0.5&&t<4.0){var u=(t-0.5)/3.5;return 1140*3*(1-u)*(1-u)/3.5;}
  if(t>=8.5&&t<11.5){var w=(t-8.5)/3;return -1140*w*w;}
  return 0;
}
function bobY(t){return 2.5*Math.sin(TAU*t/4+0.6);}
function rampAng(t){
  if(t<4.2)return 65;
  if(t<5.0)return 65*(1-sm((t-4.2)/0.8));

    legF:"M-1.5 "+hipY.toFixed(2)+"L"+P2([lF.kx,lF.ky])+"L"+P2([lF.fx,lF.fy]),

    shF:"translate("+lF.fx.toFixed(2)+" "+(lF.fy).toFixed(2)+") rotate("+shoeAng(pF).toFixed(1)+")",
    shN:"translate("+lN.fx.toFixed(2)+" "+(lN.fy).toFixed(2)+") rotate("+shoeAng(pN).toFixed(1)+")",
    tail:"M-8 -136Q"+(-20+3*fw).toFixed(1)+" -128 "+(-25+4*Math.sin(TAU*t/GT+1)).toFixed(1)+" "+(-112+3*fw).toFixed(1),
    fcx:fcx.toFixed(2),frx:frx.toFixed(2),
    nose:Math.abs(cy)<0.08?"M0 0":"M"+nbx.toFixed(2)+" 0L"+(nbx+dirn*nl).toFixed(2)+" 3.4L"+nbx.toFixed(2)+" 5.2Z",
    eA:(3.6*cy+2.8*sy).toFixed(2),eB:(3.6*cy-2.8*sy).toFixed(2),
    cas:"translate("+aN.h[0].toFixed(2)+" "+aN.h[1].toFixed(2)+") rotate("+(-aN1*0.6+2*Math.sin(TAU*t/GT*2)).toFixed(2)+")"
  };
  for(i=0;i<3;i++)applyRig(rigs[i],G);
  pg.setAttribute("transform","translate("+px.toFixed(2)+" "+gh.toFixed(2)+")");
  clipR.setAttribute("x",(xf(t)-143).toFixed(1));
  opG.setAttribute("opacity",sm((t-5)/0.25).toFixed(3));
  rigShade.setAttribute("opacity",(1-sm((t-5.2)/0.55)).toFixed(3));
  /* lantern-side lighting of the figure */
  var dxL=1180-px,dist=Math.sqrt(dxL*dxL+85*85),I=g*cl(1.15-dist/760,0,1),dir=cl(dxL/60,-1,1);
  stopR.setAttribute("stop-opacity",cl(I*(0.55+0.45*dir),0,0.95).toFixed(3));
  stopL.setAttribute("stop-opacity",cl(I*(0.55-0.45*dir),0,0.95).toFixed(3));
}

/* ---------- clock ---------- */
function wrap(x){return((x%D)+D)%D;}
var qs=new URLSearchParams(location.search),tv=qs.get("t");
if(tv!==null&&tv.trim()!==""&&isFinite(Number(tv))){
  render(wrap(Number(tv)));
}else{
  var tStart=performance.now();
  var frame=function(){render(wrap((performance.now()-tStart)/1000));requestAnimationFrame(frame);};
  frame();
}
})();
</script>
