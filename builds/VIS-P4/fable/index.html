<title id="artTitle">The Last Ferry</title>
<desc id="artDesc">A side view of a small harbour at blue-hour dusk. A double-ended passenger ferry with glowing cabin windows glides in from the left, past a far headland where a lighthouse beam slowly sweeps, and lowers its bow ramp onto a stone quay. As the ramp touches down a quay lantern warms into light, and a lone passenger in a red coat, carrying a small case, steps out of the cabin doorway and walks off across the ramp into the evening, glancing back once. The ramp rises, the ferry backs away over rippling water, and the lantern fades, leaving twinkling stars and the turning beam.</desc>

sa(E.vilRef,'opacity',f2(0.5+0.3*Math.sin(w4+1)));
/* water */
for(n=0;n<shimmer.length;n++){o=shimmer[n];sa(o.e,'opacity',f2(o.b*(0.5+0.5*Math.sin(w4+o.ph))));sa(o.e,'transform','translate('+f2(5*Math.sin(w4+o.ph+1.4))+' 0)');}
for(n=0;n<ripples.length;n++){o=ripples[n];sa(o.e,'transform','translate('+f2(o.lam*fr(o.dir*t/4))+' 0)');}
for(n=0;n<wob.length;n++){o=wob[n];sa(o.e,'opacity',f2(0.55+0.45*Math.sin(w4+o.ph)));sa(o.e,'transform','translate('+f2(3*Math.sin(w4+o.ph*1.7))+' 0)');}
var pts='',x;
for(x=0;x<=1000;x+=20)pts+=(x?'L':'')+x+','+f2(640+1.5*Math.sin(TAU*(x/160-t/4))+0.8*Math.sin(TAU*(x/70+t/4)+1.3));
sa(E.nearSea,'d','M0,900L'+pts+'L1000,900Z');sa(E.crest,'d','M'+pts);

/* ferry */
var on=t>0.5&&t<11.5,xf=ferryX(t),v=ferryV(t);

var bob=(1.1-0.7*dock)*Math.sin(w4+0.7),pit=(0.08-0.05*dock)*Math.sin(w4+2.2),pr=pit*DEG,cp=Math.cos(pr),sp=Math.sin(pr);
var hx=xf+260*cp,hy=610+bob+260*sp,ang=rampAngle(t),g=glow(t);
show(E.ferry,on);show(E.ramp,on);show(E.cable,on);show(E.fRef,on);
if(on){
sa(E.ferry,'transform','translate('+f2(xf)+' '+f2(610+bob)+') rotate('+f3(pit)+')');
var rest=Math.asin(cl((610-hy)/140,-1,1))/DEG,rot=-ang+(1-ang/65)*rest,rr=rot*DEG;
sa(E.ramp,'transform','translate('+f2(hx)+' '+f2(hy)+') rotate('+f3(rot)+')');
sa(E.cable,'x1',f2(xf+246*cp+120*sp));sa(E.cable,'y1',f2(610+bob+246*sp-120*cp));
sa(E.cable,'x2',f2(hx+100*Math.cos(rr)+5*Math.sin(rr)));sa(E.cable,'y2',f2(hy+100*Math.sin(rr)-5*Math.cos(rr)));
sa(E.fRef,'transform','translate('+f2(xf)+' 0)');
sa(E.bowLit,'opacity',f2(0.85*g*cl(1-(1000-hx)/420,0,1)));
sa(E.rampLit,'opacity',f2(g*(1-0.35*ang/65)*cl(1-(1000-hx)/500,0,1)));
}
/* bow wave, hull foam and wake follow speed */
var k=kOf(v),dir=v>=0?1:-1,env=dir<0?1-sm((t-11.14)/0.3):1,mov=on&&k>0.012;
show(E.bowWave,mov);show(E.wake,mov);show(E.hullFoam,mov);
if(mov){
sa(E.bowWave,'transform','translate('+f2(xf+dir*236)+' 641) scale('+f3(dir*(0.5+0.85*k))+' '+f3(0.3+1.05*k)+')');
sa(E.bowWave,'opacity',f2(Math.min(1,k*2.2)));
sa(E.wake,'transform','translate('+f2(xf-dir*236)+' 642) scale('+f3(-dir*(0.25+0.75*k))+' 1)');

sa(E.hullFoam,'transform','translate('+f2(xf)+' 641)');
sa(E.hullFoam,'opacity',f2(0.6*k));
}
for(n=0;n<foam.length;n++){o=foam[n];var I=0,age=0,a;

if(o.td>=0&&t>o.td){a=t-o.td;var Id=o.kd*Math.exp(-a/0.5)*Math.min(1,a/0.06)*(1-sm((t-11.14)/0.3));if(Id>I){I=Id;age=a;}}
if(I<0.012)I=0;
sa(o.e,'opacity',f2(0.78*I));if(I>0)sa(o.e,'rx',f1(o.rx*(1+0.9*Math.min(1,age))));}
/* horn steam 3.8 .. 5.0 */
for(n=0;n<puffs.length;n++){o=puffs[n];var q=(t-o.b)/o.l,vis=q>0&&q<1&&t<5;show(o.e,vis);
if(vis){sa(o.e,'cx',f2(720+26*Math.pow(q,1.5)+o.jx*q));sa(o.e,'cy',f2(322-o.rise*(1-Math.pow(1-q,2.4))));
sa(o.e,'r',f2(7+30*Math.pow(q,0.6)+o.rr));sa(o.e,'opacity',f2(0.85*Math.min(1,(t-o.b)/0.05)*Math.pow(1-q,1.3)));}}
/* lantern */
sa(E.quayLit,'opacity',f3(g));sa(E.halo,'opacity',f3(g));sa(E.lampRef,'opacity',f3(g));

/* passenger */
var xp=640+240*(t-5),d=xp-640,inside=on&&t>=4.3&&t<5,outside=t>=5&&xp<1690;
show(E.pIn,inside);show(E.pOut,outside);show(E.pShadow,outside);
if(inside){pose(figIn,d,0);sa(figIn.g,'transform','translate('+f2(xp-740)+' 0)');}
var lit=false;
if(outside){
var gy=xp<=hx?610+bob+(xp-xf)*Math.tan(pr):xp<hx+140?hy+(610-hy)*(xp-hx)/140:610;
var gl=sm((t-7.3)/0.4)*(1-sm((t-7.8)/0.3)),tr='translate('+f2(xp)+' '+f2(gy)+')';
pose(figOut,d,gl);sa(figOut.g,'transform',tr);
var dx=1180-xp,Il=g*Math.exp(-(dx*dx)/62500),Idr=0.42*sm(d/40)*Math.exp(-Math.pow(Math.max(0,d-40)/75,2)),It=Il+Idr;
var L=It>0.001?(Il*cl(dx/80,-1,1)-Idr)/It:0,bst=0.35*(1-L*L);
lit=It>0.012;
if(lit){pose(figLit,d,gl);sa(E.pLitT,'transform',tr);sa(E.pLitT,'opacity',f2(cl(It*1.05,0,1)));
var va=Math.round(255*cl(Math.pow(0.5-0.5*L,1.3)+bst,0,1)),vb=Math.round(255*cl(Math.pow(0.5+0.5*L,1.3)+bst,0,1));
sa(E.litA,'stop-color','rgb('+va+','+va+','+va+')');sa(E.litB,'stop-color','rgb('+vb+','+vb+','+vb+')');}
sa(E.pShadow,'cx',f2(xp-L*9*Math.min(1,It)));sa(E.pShadow,'cy',f2(gy+1.4));
sa(E.pShadow,'rx',f1(21+9*Math.min(1,It)));sa(E.pShadow,'opacity',f2(sm(d/36)*(0.3+0.3*Math.min(1,It))));
}
show(E.pLitT,lit);
}

/* ---------- clock ---------- */
var m=/[?&]t=([^&#]*)/.exec(window.location.search),fixed=null;
if(m){var tv=parseFloat(m[1]);if(isFinite(tv))fixed=((tv%LOOP)+LOOP)%LOOP;}
if(fixed!==null){render(fixed);}
else{var t0=performance.now();render(0);
(function tick(){render(((performance.now()-t0)/1000)%LOOP);window.requestAnimationFrame(tick);})();}
})();
