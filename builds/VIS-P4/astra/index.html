<script>

const ripples=Array.from({length:126},(_,i)=>{let y=432+rnd()*455,x=rnd()*1600,len=8+(y-420)*.22*rnd();return {e:node('path',{fill:'none',stroke:i%4===0?'#b6a6a0':'#809ca9','stroke-width':.6+(y-420)/230,'stroke-linecap':'round'},$('ripples')),x,y,len,phase:rnd()*tau}});
const reflections=Array.from({length:24},(_,i)=>({e:node('rect',{rx:1.5},$('lampReflection')),i}));
const towerRef=Array.from({length:22},(_,i)=>({e:node('rect',{rx:1},$('towerReflection')),i}));

function attr(e,a){for(const k in a)e.setAttribute(k,a[k])}
function foot(t,offset){const cycle=.56,p=((t-5)/cycle+offset)%1,q=(p+1)%1;const reach=240*cycle/4;if(q<.5)return {x:reach-240*cycle*q,y:608};const u=(q-.5)*2;return {x:-reach+2*reach*smooth(u),y:608-20*Math.sin(Math.PI*u)};}
function leg(e,shoe,f,hipX){const hx=hipX,hy=537,dx=f.x-hx,dy=f.y-hy,dist=Math.hypot(dx,dy),bend=Math.sqrt(Math.max(0,42*42-dist*dist/4));const kx=(hx+f.x)/2+dy/dist*bend,ky=(hy+f.y)/2-dx/dist*bend;attr(e,{d:`M${hx} ${hy}Q${kx} ${ky} ${f.x} ${f.y-3}`});attr(shoe,{d:`M${f.x-3} ${f.y}L${f.x+9} ${f.y}`});}
function frame(t){
 const a=clamp((t-.5)/3.5),d=clamp((t-8.5)/3);let xf=t<4?-400+1140*(1-(1-a)**3):t<8.5?740:740-1140*d**3;
 const visible=t>=.5&&t<11.5;let speed=t<4?3*1140/3.5*(1-a)**2:t>=8.5?1140*d*d:0;let motion=clamp(speed/550),bob=2*Math.sin(t*tau/4)*clamp(speed/100);
 attr($('boat'),{transform:`translate(${xf} ${bob})`,visibility:visible?'visible':'hidden'});
 let angle=t<4.2?65:t<5?65*(1-smooth((t-4.2)/.8)):t<7.4?0:65*smooth((t-7.4)/.8);
 attr($('ramp'),{transform:`translate(260 610) rotate(${-angle})`});
 let glow=t<5?0:t<5.6?smooth((t-5)/.6):t<9?1:1-smooth((t-9)/.6);
 for(const id of ['quayLight','lampReflection','lampHaloCircle','lampCore'])attr($(id),{opacity:glow});attr($('lampGlass'),{fill:`rgb(${88+110*glow},${97+73*glow},${106+12*glow})`});attr($('rampLight'),{opacity:glow*.65});
 const theta=t*tau/12,c=Math.cos(theta),front=Math.max(0,Math.sin(theta))**12;

 towerRef.forEach(({e,i})=>{let w=Math.sin(t*tau/4+i*1.8),width=5+i*2.9+4*w;attr(e,{x:260-width/2+w*4,y:430+i*6.3,width,height:1.3,opacity:(.05+front*.29)*(1-i/24)})});

 const steamU=clamp((t-3.8)/1.2),steamOn=t>=3.8&&t<5;
 puffs.forEach((e,i)=>{let u=clamp(steamU-i*.027),spread=8+u*38;attr(e,{cx:xf-20+u*57+Math.sin(i*2.1)*spread*.7,cy:420-u*(132+i*5)+bob,rx:5+u*(18+i*1.7),ry:7+u*(14+i),opacity:steamOn?Math.sin(Math.PI*u)*.22*(1-smooth((steamU-.6)/.4)):0})});
 const px=640+240*(t-5),pvisible=t>=5&&t<9.4;
 attr($('passenger'),{transform:`translate(${px} 0)`,visibility:pvisible?'visible':'hidden',opacity:smooth((t-5)/.12)});
 const fa=foot(t,0),fb=foot(t,.5);leg($('legA'),$('shoeA'),fa,3);leg($('legB'),$('shoeB'),fb,-6);
 let gait=Math.sin((t-5)*tau/.56),upperBob=-1.5*Math.cos((t-5)*tau/.28);attr($('torso'),{transform:`translate(0 ${upperBob})`});
 let handX=7-9*gait;attr($('arm'),{d:`M-6 489Q${-5-4*gait} 513 ${handX} 540`});attr($('case'),{transform:`translate(${handX} 545) rotate(${-gait*4})`});

 let lit=glow*Math.max(0,1-Math.abs(px-1180)/230);attr($('coatLight'),{d:px<1180?'M14 484L23 531 14 541':'M-12 484L-16 514-19 539',opacity:lit});
}
