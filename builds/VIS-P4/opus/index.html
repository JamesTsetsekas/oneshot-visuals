<script>
(function () {
  'use strict';
  var D = 12, TAU = Math.PI * 2, DEG = Math.PI / 180;
  function $(id) { return document.getElementById(id); }
  function sm(u) { return u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function f(v) { return (Math.round(v * 100) / 100).toString(); }
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var R = rng(20261111);

  /* ---------- timeline ---------- */
  function xf(t) {
    if (t <= 0.5) return -400;
    if (t < 4) { var u = (t - 0.5) / 3.5, w = 1 - u; return -400 + 1140 * (1 - w * w * w); }
    if (t <= 8.5) return 740;
    if (t < 11.5) { var q = (t - 8.5) / 3; return 740 - 1140 * q * q * q; }
    return -400;
  }
  function vf(t) {
    if (t <= 0.5 || t >= 11.5) return 0;
    if (t < 4) { var u = (t - 0.5) / 3.5; return 1140 * 3 * (1 - u) * (1 - u) / 3.5; }
    if (t <= 8.5) return 0;
    var q = (t - 8.5) / 3; return -1140 * q * q;
  }
  function rampA(t) {
    if (t < 4.2) return 65;
    if (t < 5) return 65 * (1 - sm((t - 4.2) / 0.8));
    if (t < 7.4) return 0;
    if (t < 8.2) return 65 * sm((t - 7.4) / 0.8);
    return 65;
  }
  function glowF(t) {
    if (t < 5) return 0;
    if (t < 5.6) return sm((t - 5) / 0.6);
    if (t < 9) return 1;
    if (t < 9.6) return 1 - sm((t - 9) / 0.6);
    return 0;
  }
  function turnF(t) {
    if (t < 7.3 || t > 8.1) return 0;
    if (t < 7.7) return sm((t - 7.3) / 0.4);
    return 1 - sm((t - 7.7) / 0.4);
  }

  /* ---------- build static pieces ---------- */
  var h;
  // stars
  var stars = [];
  h = '';
  for (var i = 0; i < 46; i++) {
    var sx, sy, tries = 0;
    do { sx = 8 + R() * 1584; sy = 10 + 330 * Math.pow(R(), 1.45); tries++; }
    while (tries < 20 && ((sx < 600 && sy > 325) || (Math.abs(sx - 260) < 30 && sy > 300)));
    var sr = 0.6 + R() * 1.2 * (1 - sy / 420);
    if (i % 9 === 0) sr += 0.5;
    h += '<circle cx="' + f(sx) + '" cy="' + f(sy) + '" r="' + f(sr) + '"/>';
    stars.push({ p: [3, 4, 6][Math.floor(R() * 3)], ph: R(), b: 0.45 + 0.55 * R() * (1 - sy / 520) });
  }
  $('stars').innerHTML = h;
  var starEls = $('stars').children;
  for (i = 0; i < stars.length; i++) stars[i].el = starEls[i];

  // water glints
  var glints = [];
  h = '';
  for (i = 0; i < 120; i++) {
    var gy = 424 + 470 * Math.pow(R(), 1.25);
    var gx = gy < 604 ? R() * 1600 : R() * 1000;
    var len = 3 + (gy - 420) * 0.085 * (0.5 + R());

        pe.setAttribute('opacity', f(Math.min(1, ag / 0.06) * Math.pow(1 - pp, 1.5) * 0.85));
      }
    } else set(E.steam, 'display', 'none');

    // lantern
    set(E.lanternLit, 'opacity', f(glow));
    set(E.halo, 'opacity', f(glow));
    set(E.haze, 'opacity', f(glow * 0.6));
    set(E.pool, 'opacity', f(glow));
    set(E.faceGlow, 'opacity', f(glow));

    renderPassenger(t, c, bob, glow);
  }

  /* ---------- clock ---------- */
  var fixed = null;
  var q = new URLSearchParams(location.search).get('t');
  if (q !== null && q.trim() !== '') {
    var tv = parseFloat(q);
    if (isFinite(tv)) fixed = ((tv % D) + D) % D;
  }
  if (fixed !== null) {
    render(fixed);
  } else {
    var tStart = performance.now();
    render(0);
    var loop = function (now) {
      var tt = ((now - tStart) / 1000) % D;
      if (tt < 0) tt += D;
      render(tt);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
