<script>
(() => {
  'use strict';
  const tau = 2 * Math.PI;
  const duration = 12;
  const byId = id => document.getElementById(id);
  const set = (node, name, value) => node.setAttribute(name, value);
  const opacity = (node, value) => set(node, 'opacity', value.toFixed(3));
  const wrap = (value, period) => ((value % period) + period) % period;
  const clamp = value => Math.max(0, Math.min(1, value));
  const smooth = value => {
    const u = clamp(value);
    return u * u * (3 - 2 * u);
  };
  const point = value => value.toFixed(2);
  const move = (node, x, y) => set(node, 'transform', 'translate(' + point(x) + ' ' + point(y) + ')');
  const show = (node, visible) => set(node, 'visibility', visible ? 'visible' : 'hidden');

  let seed = 0x163f491b;
  function sample() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  function svg(parent, name, attributes) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [key, value] of Object.entries(attributes)) set(node, key, value);
    parent.appendChild(node);
    return node;
  }

  function stipple(parent, count, height, colors, scale) {
    for (const [fill, alpha] of colors) {
      let marks = '';
      for (let i = 0; i < count; i++) {
        const x = sample() * 1600;
        const y = sample() * height;
        const w = (.32 + sample() * 2) * scale;
        const h = .23 + sample() * .8;
        marks += 'M' + point(x) + ' ' + point(y) + 'h' + point(w) + 'v' + point(h) + 'h-' + point(w) + 'Z';
      }
      svg(parent, 'path', { d: marks, fill, opacity: alpha });
    }
  }
  stipple(byId('sky-grain'), 1020, 420, [['#ffd6c6', .19], ['#1a263b', .28]], 1.2);
  stipple(byId('finish-grain'), 1550, 900, [['#f8cfb0', .14], ['#101927', .21]], 1);

  const stars = Array.from({ length: 72 }, (_, i) => {
    const x = 42 + sample() * 1516;
    const y = 48 + Math.pow(sample(), 1.48) * 249;
    const radius = .55 + Math.pow(sample(), 2.35) * 1.51;
    const group = svg(byId('stars'), 'g', { transform: 'translate(' + x + ' ' + y + ')' });
    if (radius > 1.7) {
      svg(group, 'circle', { r: radius * 3.2, opacity: '.095' });
      svg(group, 'path', { d: 'M0-4.4.6-.7 3.9 0 .6.7 0 4.4-.6.7-3.9 0-.6-.7Z', opacity: '.46' });
    }
    svg(group, 'circle', { r: radius });
    return { group, phase: tau * sample(), period: [3, 4, 6][i % 3], strength: Math.max(.31, .94 - y / 570) };
  });

  let trees = '';
  const ridge = [[0,365],[53,361],[95,345],[134,349],[167,354],[191,357],[220,361],[252,373],[280,375],[317,390],[344,401]];
  for (let i = 0; i < 80; i++) {
    const x = sample() * 347;
    const p = ridge.findIndex(([nextX]) => nextX > x);
    if (p < 1) continue;
    const [ax, ay] = ridge[p - 1];
    const [bx, by] = ridge[p];
    const y = ay + (by - ay) * ((x - ax) / (bx - ax)) + sample() * 13;
    const h = 2 + sample() * 11;
    const w = h * (.21 + sample() * .21);
    trees += 'M' + point(x - w) + ' ' + point(y) + 'l' + point(w * .72) + ' ' + point(-h * .42) +
      'l' + point(w * .28) + ' ' + point(-h * .58) + 'l' + point(w) + ' ' + point(h) + 'Z';
  }
  svg(byId('headland-trees'), 'path', { d: trees });

  const stoneColors = ['#535261', '#585262', '#494a5d', '#5d5660', '#4d4b5c', '#454858'];
  const courses = [
    [638, 686, [44, 87, 108, 92, 107, 110, 78]],
    [688, 749, [76, 114, 104, 116, 88, 120]],
    [751, 825, [37, 113, 117, 84, 109, 92, 72]],
    [827, 907, [81, 94, 112, 114, 121, 100]]
  ];
  for (const [top, bottom, widths] of courses) {
    let x = 998;
    for (const w of widths) {
      const left = x + 2;
      const right = x + w - 2;
      const y = top + sample() * 4;
      const base = bottom - sample() * 3;
      const shape = 'M' + (left + 6) + ' ' + point(y) + 'L' + point(left + w * .63) + ' ' + point(y + 2) +
        'L' + (right - 5) + ' ' + point(y + 1) + 'L' + right + ' ' + point(y + 9) + 'L' + (right - 3) + ' ' + point(base - 7) +
        'L' + (right - 9) + ' ' + point(base) + 'L' + point(left + w * .39) + ' ' + point(base - 1) +
        'L' + (left + 4) + ' ' + point(base + 1) + 'L' + left + ' ' + point(base - 8) + 'L' + (left + 2) + ' ' + point(y + 8) + 'Z';
      const parent = byId('stones');
      svg(parent, 'path', { d: shape, fill: stoneColors[Math.floor(sample() * stoneColors.length)] });
      svg(parent, 'path', { d: shape, fill: 'url(#block-tone)' });
      svg(parent, 'path', { d: 'M' + (left + 4) + ' ' + point(y + 8) + 'l4-5 ' + point(w * .4) + ' 1 ' + point(w * .28) + '-1',
        fill: 'none', stroke: '#b29895', 'stroke-opacity': '.31' });
      let nicks = '';
      for (let i = 0; i < 24; i++) {
        const nx = left + 6 + sample() * (w - 17);
        const ny = y + 7 + sample() * (base - y - 14);
        nicks += 'M' + point(nx) + ' ' + point(ny) + 'l' + point(1 + sample() * (i % 4 === 0 ? 17 : 5)) + ' ' + point((sample() - .5) * 2);
      }
      svg(parent, 'path', { d: nicks, stroke: '#c1a6a3', 'stroke-width': .9, 'stroke-opacity': .23, 'stroke-linecap': 'round' });
      x += w;
    }
  }

  function waveMark(x, y, width, height) {
    return 'M' + point(x) + ' ' + point(y) + 'q' + point(width * .34) + ' ' + point(-height) + ' ' +
      point(width) + ' 0q' + point(-width * .61) + ' ' + point(height * .73) + ' ' + point(-width) + ' 0Z';
  }

  const waterTints = ['#df9fa1', '#b395a7', '#93a0b6', '#627a99', '#152842', '#121e31'];

    let d = '';

      const y = 421 + depth * (band < 2 ? 262 : 485);
      const x = sample() * (y > 608 ? 1070 : 1600) - 44;
      const width = (8 + sample() * 65) * (.32 + depth * 1.55);
      d += waveMark(x, y, width, (.24 + depth * 1.7) * (1 + sample() * 1.6));

  svg(byId('water-lines'), 'path', { d: 'M14 640q150-1.6 238 0m20 1q64-1.4 143 0m18 1q94-2 202-1m57-1q121-2.5 280 0',
    fill: 'none', stroke: '#a7adba', 'stroke-opacity': .22 });
  const ripples = Array.from({ length: 10 }, (_, band) => {
    const parent = svg(byId('ripples'), 'g', {});
    let d = '';
    for (let i = 0; i < 23; i++) {
      const depth = Math.pow(sample(), 1.25);
      const y = 424 + depth * 467;
      const x = sample() * (y < 610 ? 1590 : 1000);
      d += waveMark(x, y, (8 + sample() * 80) * (.21 + depth), (.6 + sample() * 1.44) * (.33 + depth));
    }
    svg(parent, 'path', { d, fill: band % 3 === 0 ? '#e7b2ad' : '#a4b2c7' });
    return parent;
  });

  function reflectedStrokes(parent, x, y, count, depth, spread, paint, reach) {
    return Array.from({ length: count }, (_, i) => {
      const fraction = (i + sample()) / count;
      const width = (3 + sample() * reach) * (.5 + fraction * .7);
      const wx = x + (sample() - .5) * spread * (.46 + fraction) - width * .5;
      const wy = y + fraction * depth;
      const path = svg(parent, 'path', { d: waveMark(wx, wy, width, .5 + fraction * 2), fill: paint });
      return { path, phase: tau * sample(), fraction, length: width };
    });
  }

  const beaconWater = reflectedStrokes(byId('light-reflection'), 260, 424, 21, 151, 79, '#ffd0a0', 43);
  const lampWater = reflectedStrokes(byId('amber-reflection'), 998, 643, 30, 174, 150, '#fac28e', 71);
  const shipWater = reflectedStrokes(byId('ship-glints'), -6, 659, 33, 71, 500, '#c2887a', 25);
  const wake = Array.from({ length: 29 }, (_, i) => ({
    path: svg(byId('foam'), 'path', { fill: i % 4 === 0 ? '#edd2c0' : '#a7b7c6' }),
    phase: sample(),
    band: sample(),
    size: 10 + sample() * 43
  }));
  const puffs = Array.from({ length: 12 }, (_, i) => ({
    node: svg(byId('steam'), 'ellipse', { fill: 'url(#steam-tone)' }),
    birth: 3.8 + i * .049,
    drift: sample() - .3,
    width: .8 + sample() * .55
  }));
  for (let x = -232; x <= 232; x += 15) {
    svg(byId('hull-rivets'), 'circle', { cx: x, cy: 617 + 13 * (1 - (x / 259) ** 2), r: 1.17 });
  }

  const scene = Object.fromEntries(['beam', 'flare', 'beacon', 'amber-reflection', 'boat-reflection',
    'ferry', 'ramp', 'quay-glow', 'ramp-light', 'bow-light', 'lantern-air', 'lit-glass', 'filament', 'lip-glint',
    'passenger', 'foot-shadow', 'exit-window', 'exit-door', 'steam', 'foam', 'light-left', 'light-right', 'trunk', 'head', 'eye',
    'cap-brim', 'ear', 'face-profile', 'scarf', 'near-arm', 'far-arm', 'arm-seam', 'case', 'door-leaf']
    .map(id => [id, byId(id)]));

  function ambient(t) {
    const theta = tau * t / duration;
    const lateral = Math.cos(theta);
    const towardViewer = Math.max(0, Math.sin(theta));
    const pulse = towardViewer ** 12;
    set(scene.beam, 'transform', 'translate(260 330) scale(' + lateral + ' 1)');
    opacity(scene.beam, Math.abs(lateral) ** .46 * .78);
    opacity(scene.flare, .09 + .89 * pulse + .18 * Math.abs(lateral));
    set(scene.flare, 'transform', 'translate(260 330) scale(' + (.5 + .62 * pulse) + ') translate(-260 -330)');
    opacity(scene.beacon, .32 + .68 * pulse + .21 * Math.abs(lateral));

    for (const { group, phase, period, strength } of stars) {
      opacity(group, strength * (.66 + .34 * Math.cos(tau * t / period + phase)));
    }
    const waterPhase = tau * t / 4;
    ripples.forEach((group, i) => {
      const angle = waterPhase + i * 1.89;
      move(group, Math.cos(angle) * (4 + i * .41), Math.sin(angle) * .82);
      opacity(group, .26 + .16 * Math.sin(angle));
    });
    twinkleWater(beaconWater, waterPhase, (.11 + .75 * pulse + .18 * Math.abs(lateral)));
    return waterPhase;
  }

  function twinkleWater(strokes, waterPhase, brightness) {
    for (const { path, phase, fraction, length } of strokes) {
      const oscillation = Math.sin(waterPhase + phase + fraction * 4);
      move(path, oscillation * (2 + Math.min(length, 49) * fraction * .29), 1.7 * Math.cos(waterPhase + phase));
      opacity(path, brightness * (1 - fraction * .91) * (.36 + .24 * oscillation));
    }
  }

  function vessel(t, waterPhase) {
    let x;
    let speed = 0;
    let backing = false;
    if (t < .5 || t >= 11.5) {
      x = -400;
    } else if (t < 4) {
      const u = (t - .5) / 3.5;
      x = -400 + 1140 * (1 - (1 - u) ** 3);
      speed = 3420 / 3.5 * (1 - u) ** 2;
    } else if (t < 8.5) {
      x = 740;
    } else {
      const u = (t - 8.5) / 3;
      x = 740 - 1140 * u ** 3;
      speed = 1140 * u ** 2;
      backing = true;
    }
    const visible = x > -390;
    show(scene.ferry, visible);
    show(scene['boat-reflection'], visible);

    const bob = 2.7 * Math.sin(waterPhase) * smooth((740 - x) / 102);
    move(scene.ferry, x, bob);
    move(scene['boat-reflection'], x, bob * .34);
    if (visible) twinkleWater(shipWater, waterPhase, .83);

    const rampAngle = 65 * (1 - smooth((t - 4.2) / .8) + smooth((t - 7.4) / .8));
    set(scene.ramp, 'transform', 'translate(260 610) rotate(' + point(-rampAngle) + ')');
    move(scene['door-leaf'], -58 * (smooth((t - 4.81) / .26) - smooth((t - 5.61) / .46)), 0);

    const steaming = t >= 3.8 && t < 5;
    show(scene.steam, steaming);
    if (steaming) puffs.forEach(({ node, birth, drift, width }) => {
      const age = t - birth;
      const life = 5 - birth;
      const u = clamp(age / life);
      const ascent = (1 - (1 - u) ** 1.56) * (150 - (birth - 3.8) * 67);
      set(node, 'cx', point(-17 + u * u * (57 + drift * 133) - u * 16));
      set(node, 'cy', point(342 - ascent + Math.sin(u * 4 + drift * 4) * u * 9));
      set(node, 'rx', point((8 + u * 49) * width));
      set(node, 'ry', point((7 + u * 30) * width));
      opacity(node, .68 * smooth(age / .115) * (1 - smooth((u - .23) / .77)));
    });

    const strength = clamp(speed / 780) ** .72 * smooth((x + 364) / 101);
    const direction = backing ? -1 : 1;
    show(scene.foam, strength > 0);
    if (strength > 0) wake.forEach(({ path, phase, band, size }, i) => {
      const travel = wrap(phase + t * (i < 13 ? .95 : .61), 1);
      const envelope = Math.sin(travel * Math.PI) ** .67;
      const nose = i < 13;
      const distance = nose ? 218 + 42 * travel + band * 54 : -204 - travel * 114 - band * 25;
      const width = size * (.53 + travel * .69) * (.53 + strength * .66);
      const wx = x + direction * distance - .5 * width;
      const wy = 638 + bob * .24 + travel * (nose ? 29 : 55) + band * 13;
      set(path, 'd', waveMark(wx, wy, width, (nose ? 3.9 : 2.3) * envelope));
      opacity(path, strength * envelope * (nose ? .74 : .46));
    });
  }

  function light(t, waterPhase) {
    const glow = smooth((t - 5) / .6) * (1 - smooth((t - 9) / .6));
    opacity(scene['lit-glass'], glow);
    opacity(scene.filament, glow);
    opacity(scene['lip-glint'], glow * .83);
    opacity(scene['lantern-air'], glow);
    opacity(scene['quay-glow'], glow);
    opacity(scene['ramp-light'], glow * .84);
    opacity(scene['bow-light'], glow * .39);
    opacity(scene['amber-reflection'], glow);
    if (glow > 0) twinkleWater(lampWater, waterPhase, .9);
    return glow;
  }

  const legs = ['near', 'far'].map(side => ({
    trouser: byId(side + '-trouser'),
    crease: byId(side + '-crease'),
    boot: byId(side + '-boot')
  }));
  const cadence = .64;
  const stance = .59;
  const halfStep = 240 * cadence * stance / 2;
  function leg(phase, hipX, hipY, i) {
    const swing = clamp((phase - stance) / (1 - stance));
    const footX = phase < stance
      ? halfStep - phase * cadence * 240
      : -halfStep + cadence * 240 * (smooth(swing) - (1 - stance) * swing);
    const lift = 11.8 * (Math.sin(Math.PI * swing) ** 1.34);
    const footY = 607 - lift;
    const dx = footX - hipX;
    const dy = footY - hipY;
    const span = Math.hypot(dx, dy);
    const bend = Math.sqrt(Math.max(0, 44 ** 2 - (span / 2) ** 2));
    const kneeX = hipX + dx / 2 + bend * dy / span;
    const kneeY = hipY + dy / 2 - bend * dx / span;
    const d = 'M' + point(hipX) + ' ' + point(hipY) + 'Q' + point(kneeX + 2) + ' ' + point(kneeY - 6) +
      ' ' + point(kneeX) + ' ' + point(kneeY) + 'L' + point(footX) + ' ' + point(footY - 3);
    const crease = 'M' + point(hipX + 7) + ' ' + point(hipY + 12) + 'Q' + point(kneeX + 6) + ' ' + point(kneeY - 4) +
      ' ' + point(kneeX + 4) + ' ' + point(kneeY + 2) + 'L' + point(footX + 3) + ' ' + point(footY - 12);
    set(legs[i].trouser, 'd', d);
    set(legs[i].crease, 'd', crease);
    if (i === 0) set(byId('near-leg-light'), 'd', d);
    const pitch = 21 * Math.sin(tau * swing) * Math.sin(Math.PI * swing);
    set(legs[i].boot, 'transform', 'translate(' + point(footX) + ' ' + point(footY) + ') rotate(' + point(pitch) + ')');
  }

  function traveler(t, glow) {
    const elapsed = t - 5;
    const active = elapsed >= 0 && t < 9.4;
    show(scene.passenger, active);
    show(scene['foot-shadow'], active);
    if (!active) return;

    const x = 640 + 240 * elapsed;
    move(scene.passenger, x, 0);
    const emerge = smooth(elapsed / .25);
    const clipEdge = 710 - 110 * emerge;
    const portalEdge = Math.min(673, Math.max(607, clipEdge));
    set(scene['exit-window'], 'x', point(Math.max(673, clipEdge)));
    set(scene['exit-door'], 'x', point(portalEdge));
    set(scene['exit-door'], 'width', point(673 - portalEdge));
    set(scene['foot-shadow'], 'cx', point(x + 2));
    opacity(scene['foot-shadow'], emerge * (.24 + .27 * glow));

    const cycle = wrap(elapsed / cadence + .33, 1);
    const angle = cycle * tau;
    const rise = -3.3 * Math.cos(2 * angle);
    leg(cycle, -9, 534 + rise, 0);
    leg(wrap(cycle + .5, 1), -12, 534 + rise, 1);
    set(scene.trunk, 'transform', 'translate(' + point(1.6 * Math.sin(angle)) + ' ' + point(rise) + ') rotate(' +
      point(1.35 * Math.sin(angle + .7)) + ' -8 533)');
    const scarfDrop = 4 * Math.sin(angle - .8);
    set(scene.scarf, 'd', 'M-10 475Q-25 477-41 ' + point(484 + scarfDrop) + 'L-38 ' + point(491 + scarfDrop) + 'Q-23 484-9 481Z');

    const glance = smooth((t - 7.3) / .4) * (1 - smooth((t - 7.7) / .4));
    const face = 1 - 2 * glance;
    const front = 14 * face;
    set(scene.head, 'transform', 'rotate(' + point(-5 * glance) + ' 0 467)');
    set(scene['face-profile'], 'd', 'M' + point(front * .62) + ' 443Q' + point(front) + ' 446 ' + point(front) +
      ' 450L' + point(front + 6 * face) + ' 454L' + point(front - 1 * face) + ' 457Q' + point(front) + ' 464 ' + point(front * .38) + ' 466L0 459Z');
    set(scene.eye, 'cx', point(front * .78));
    set(scene.ear, 'd', 'M' + point(-5.7 * face) + ' 451q-2-3-3 0t3 6q2-1 0-6Z');
    set(scene['cap-brim'], 'transform', 'scale(' + point(face) + ' 1)');

    const delta = 1180 - x;
    const exposure = glow * Math.exp(-((delta / 160) ** 2));
    const side = clamp(.5 + delta / 66);
    set(scene['light-left'], 'stop-opacity', point(.76 * exposure * (1 - side)));
    set(scene['light-right'], 'stop-opacity', point(.76 * exposure * side));

    const swing = Math.sin(angle + .3);
    const caseX = -14 + swing * 14;
    const caseY = 547 + rise - 2.7 * swing;
    set(scene['near-arm'], 'd', 'M-14 ' + point(485 + rise) + 'Q' + point(caseX * .77 - 8) + ' ' + point(522 + rise) + ' ' + point(caseX) + ' ' + point(caseY - 4));
    set(byId('sleeve-light'), 'd', scene['near-arm'].getAttribute('d'));
    set(scene['arm-seam'], 'd', 'M-17 ' + point(480 + rise) + 'Q' + point(caseX * .77 - 11) + ' ' + point(518 + rise) + ' ' + point(caseX - 3) + ' ' + point(caseY - 9));
    set(scene['far-arm'], 'd', 'M6 ' + point(484 + rise) + 'Q' + point(14 - swing * 12) + ' ' + point(513 + rise) + ' ' + point(14 - swing * 20) + ' ' + point(537 + rise));
    set(scene.case, 'transform', 'translate(' + point(caseX) + ' ' + point(caseY) + ') rotate(' + point(swing * 8.5) + ')');
  }

  function render(t) {
    const waterPhase = ambient(t);
    vessel(t, waterPhase);
    const glow = light(t, waterPhase);
    traveler(t, glow);
  }

  const seek = new URLSearchParams(location.search).get('t');
  if (seek !== null) {
    const time = Number(seek);
    render(Number.isFinite(time) ? wrap(time, duration) : 0);
  } else {
    const start = performance.now();
    render(0);
    function frame(now) {
      render(wrap((now - start) / 1000, duration));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>

</body>
</html>
