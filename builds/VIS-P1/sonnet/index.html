<title id="tt">Glasshouse at Blue Hour</title>
<desc id="dd">An isometric cutaway of a small glasshouse on a stone plinth at dusk. Two rear walls of iron-framed tinted glass stand over a checkerboard stone floor, with a round lily pond, two raised planting beds of spiky, fan-leaved and feathery plants, a specimen tree in a pot and three warm glowing lamp standards casting pools of light. A deep blue to amber-rose sky with stars, a crescent moon and two layers of hills surrounds it, and blurred dark fronds frame the lower corners.</desc>
