<title id="art-title">Glasshouse at Blue Hour</title>
<desc id="art-desc">A true-isometric cutaway of a small iron-framed glasshouse on a stone plinth at dusk. Two glazed rear walls stand against a deep blue to amber-rose sky with two ranges of hills and a few stars. Inside, a checkerboard stone floor holds a round lily pond, two raised planting beds with ferns, fan palms, agaves and broad-leaved plants, a potted specimen tree in the rear corner, and three lantern standards casting warm pools of light, while cool moonlight from the rear left throws long blue shadows to the right. Two blurred dark fronds frame the bottom corners.</desc>
