<title id="art-title">Glasshouse at Blue Hour</title>
<desc id="art-desc">An isometric cutaway of a small glasshouse on a low stone plinth at blue hour. Two iron-framed glass walls stand at the rear; the front walls and roof are open. Inside, a checkerboard stone floor holds a round lily pond, two raised beds of spiky, fan-leaved and feathery plants, a potted citrus tree and three cast-iron lanterns whose warm pools of light are the brightest part of the scene, while a low moon to the rear-left casts long blue shadows. Behind the glass a dusk sky fades from deep blue to amber-rose above two layers of distant hills, and blurred fronds frame the lower corners.</desc>
